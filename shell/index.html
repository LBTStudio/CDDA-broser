<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Cataclysm: Dark Days Ahead</title>
    <style>
      @font-face { font-family: Terminus; src: url("./Terminus.ttf"); }
      html { padding: 0; margin: 0; height: 100%; overflow: hidden; }
      body { padding: 0; margin: 0; height: 100%; overflow: hidden; background-color: grey; }
      canvas { margin: 0; padding: none; border: 0px none; background-color: black; display: block; position: absolute; left: 0px; top: 0px; outline: none; image-rendering: pixelated; z-index: 1; }
      #loading-message { color: white; position: absolute; top: 50%; left: 50%; font-size: 30px; transform: translate(-50%, -50%); text-align: center; font-family: Terminus, monospace; z-index: 4; }
      #settings-gear { color: white; opacity: 0.5; position: absolute; top: 10px; left: 10px; z-index: 2; font-size: 20px; cursor: pointer; }
      #settings-gear:hover { opacity: 1; }
      #settings-menu { color: white; background-color: black; z-index: 3; position: absolute; top: 40px; left: 10px; display: flex; flex-direction: column; border-radius: 5px; padding: 15px; align-items: stretch; border-color: white; border-style: solid; }
      .menu-button { font-family: Terminus, monospace; font-size: 20px; cursor: pointer; opacity: 0.7; }
      .menu-button:hover { opacity: 1; }
      a { color: white; text-decoration: none; }
      #profile-screen { position: absolute; inset: 0; z-index: 10; background-color: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eee; font-family: Terminus, monospace; gap: 14px; }
      #profile-screen h1 { font-size: 26px; margin: 0 0 6px 0; letter-spacing: 2px; }
      #profile-screen .sub { opacity: 0.7; font-size: 14px; margin-bottom: 10px; }
      #profile-input { font-family: Terminus, monospace; font-size: 22px; padding: 8px 12px; background: #000; color: #eee; border: 2px solid #555; border-radius: 4px; width: 260px; text-align: center; outline: none; }
      #profile-input:focus { border-color: #9cf; }
      #profile-start { font-family: Terminus, monospace; font-size: 22px; padding: 10px 28px; background: #2a5d2a; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
      #profile-start:hover { background: #3a7d3a; }
      #profile-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px; }
      .profile-chip { font-family: Terminus, monospace; font-size: 16px; padding: 6px 14px; background: #333; border: 1px solid #666; border-radius: 16px; cursor: pointer; color: #ddd; }
      .profile-chip:hover { background: #444; border-color: #9cf; }
      .profile-chip .del { color: #c66; margin-left: 8px; font-weight: bold; }
      #profile-note { font-size: 12px; opacity: 0.55; max-width: 480px; text-align: center; line-height: 1.5; margin-top: 8px; }
      #error-overlay { display: none; position: absolute; inset: 0; z-index: 20; background: rgba(10, 0, 0, 0.92); color: #fdd; font-family: Terminus, monospace; padding: 28px; box-sizing: border-box; overflow: auto; }
      #error-overlay h2 { color: #f88; margin-top: 0; }
      #error-overlay pre { white-space: pre-wrap; word-break: break-all; background: #200; padding: 10px; border-radius: 4px; font-size: 13px; }
      #error-overlay button { font-family: Terminus, monospace; font-size: 18px; padding: 8px 22px; background: #632; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
      #error-overlay button:hover { background: #853; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/screenfull.js/5.2.0/screenfull.min.js" integrity="sha512-GoG2/bE6QSPKSrjuoII6iPL2ODnwUJvFgysFYLTW2ltpx6G5nj+mYvhPq5rLPZby0rdMFU2fo4BMlWND7+QZ5g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js" integrity="sha512-csNcFYJniKjJxRWRV1R7fvnXrycHP6qDR21mgz1ZP55xY5d+aHLfo9/FcGDQLfn2IfngbAHd8LdfsagcCqgTcQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="shortcut icon" href="favicon.ico" />
    <meta property="og:title" content="Cataclysm: Dark Days Ahead" />
    <meta property="og:description" content="A port of Cataclysm: Dark Days Ahead for the browser." />
  </head>
  <body>
    <div id="profile-screen">
      <h1>Cataclysm: Dark Days Ahead</h1>
      <div class="sub">Who is playing? / プレイヤー名を入力してください</div>
      <input id="profile-input" maxlength="24" placeholder="player name" autocomplete="off" />
      <button id="profile-start">&#9654; Start / 開始</button>
      <div id="profile-list"></div>
      <div id="profile-note">
        Save data is stored separately per player name, in this browser, on this device.<br />
        セーブデータはプレイヤー名ごとに別々に、このブラウザ内に保存されます。
      </div>
    </div>

    <div id="settings-gear"><i class="fa-solid fa-gear"></i></div>
    <div id="settings-menu" style="display: none">
      <div style="margin-bottom: 10px">
        <div id="toggle-fullscreen" class="menu-button"><i class="fa-solid fa-expand"></i><span style="margin-left: 0.7em">Toggle Fullscreen</span></div>
      </div>
      <div style="margin-bottom: 10px">
        <div id="export-saves" class="menu-button"><i class="fa-solid fa-download"></i><span style="margin-left: 0.7em">Export Saves</span></div>
      </div>
      <div style="margin-bottom: 10px">
        <div id="switch-player" class="menu-button"><i class="fa-solid fa-user"></i><span style="margin-left: 0.7em">Switch Player</span></div>
      </div>
      <div>
        <a target="_blank" href="https://github.com/CleverRaven/Cataclysm-DDA">
          <div id="browse-code" class="menu-button"><i class="fa-brands fa-github"></i><span style="margin-left: 0.7em">Browse Code</span></div>
        </a>
      </div>
    </div>

    <canvas id="canvas" style="width: 100%; height: 100%; min-width: 640px; min-height: 384px;" tabindex="-1"></canvas>
    <div id="loading-message" style="display: none">Loading...</div>

    <div id="error-overlay">
      <h2>エラーが発生しました / An error occurred</h2>
      <div id="error-hint" style="margin-bottom: 12px; line-height: 1.6;"></div>
      <pre id="error-detail"></pre>
      <button onclick="location.reload()">&#8635; 再読み込み / Reload</button>
      <button onclick="document.getElementById('error-overlay').style.display='none'">閉じる / Dismiss</button>
    </div>

    <script type="text/javascript">
      const canvas = document.getElementById("canvas");
      const loadingMessage = document.getElementById("loading-message");
      const settingsMenu = document.getElementById("settings-menu");
      const profileScreen = document.getElementById("profile-screen");
      const profileInput = document.getElementById("profile-input");
      const profileStart = document.getElementById("profile-start");
      const profileList = document.getElementById("profile-list");

      /* Per-player save isolation: each name maps to /home/<name>/.cataclysm-dda
         inside the game's virtual FS (the game resolves HOME + "/.cataclysm-dda/").
         The name list itself lives in localStorage. */
      const LS_PROFILES = "cdda_web_profiles";
      const LS_LAST = "cdda_web_last_profile";

      function getProfiles() {
        try { return JSON.parse(localStorage.getItem(LS_PROFILES) || "[]"); }
        catch (e) { return []; }
      }
      function setProfiles(list) { localStorage.setItem(LS_PROFILES, JSON.stringify(list)); }
      function sanitize(name) {
        return name.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 24);
      }
      function renderProfileChips() {
        profileList.innerHTML = "";
        for (const p of getProfiles()) {
          const chip = document.createElement("span");
          chip.className = "profile-chip";
          chip.textContent = p;
          chip.onclick = () => startGame(p);
          const del = document.createElement("span");
          del.className = "del";
          del.textContent = "×";
          del.title = "Remove from list (save data stays in the browser)";
          del.onclick = (ev) => {
            ev.stopPropagation();
            setProfiles(getProfiles().filter((x) => x !== p));
            renderProfileChips();
          };
          chip.appendChild(del);
          profileList.appendChild(chip);
        }
      }
      profileInput.value = localStorage.getItem(LS_LAST) || "";
      renderProfileChips();

      function startGame(profile) {
        if (!profile) return;
        if (!getProfiles().includes(profile)) setProfiles(getProfiles().concat(profile));
        localStorage.setItem(LS_LAST, profile);
        window.CDDA_PROFILE = profile;
        // Module.ENV is created before a player chooses a profile.  Update
        // all locale-relevant paths before the Emscripten runtime starts.
        // CDDA 0.I can use either HOME/config or XDG_CONFIG_HOME depending on
        // its compile configuration, so both must refer to this profile.
        if (window.Module && Module.ENV) {
          const home = "/home/" + profile;
          Module.ENV.HOME = home;
          Module.ENV.XDG_CONFIG_HOME = home + "/.config";
          Module.ENV.LANG = "ja";
          Module.ENV.LANGUAGE = "ja";
        }
        profileScreen.style.display = "none";
        loadingMessage.style.display = "block";
        boot();
      }
      profileStart.onclick = () => {
        const p = sanitize(profileInput.value);
        if (!p) { profileInput.placeholder = "letters/numbers only"; profileInput.value = ""; return; }
        startGame(p);
      };
      profileInput.addEventListener("keydown", (e) => { if (e.key === "Enter") profileStart.onclick(); });

      let booted = false;
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Could not load " + src));
          document.body.appendChild(script);
        });
      }
      async function boot() {
        if (booted) return;
        booted = true;
        try {
          /* The data pack registers its preRun callback.  It must finish
             evaluating before the game runtime starts, otherwise CDDA scans
             lang/mo before the Japanese MO catalog exists in its virtual FS. */
          await loadScript("cataclysm-tiles.data.js");
          await loadScript("cataclysm-tiles.js");
        } catch (error) {
          booted = false;
          console.error(error);
          loadingMessage.textContent =
            "読み込みに失敗しました。再読み込みしてください。 / Failed to load game data. Reload and try again.";
        }
      }

      window.addEventListener("menuready", () => { loadingMessage.style.display = "none"; });
      document.getElementById("settings-gear").onclick = () => {
        settingsMenu.style.display = settingsMenu.style.display === "none" ? "inherit" : "none";
      };
      canvas.addEventListener("click", () => { settingsMenu.style.display = "none"; });
      document.getElementById("toggle-fullscreen").onclick = () => {
        // screenfull comes from a CDN; a blocked/offline CDN must not turn
        // fullscreen into an uncaught error.  Fall back to the native API.
        // Both paths return promises that reject when the browser denies
        // fullscreen (e.g. no user-gesture credit); swallow those so they
        // never surface through the unhandledrejection handler.
        try {
          if (typeof screenfull !== "undefined" && screenfull.isEnabled) {
            Promise.resolve(screenfull.toggle()).catch(() => {});
            return;
          }
          if (document.fullscreenElement) {
            Promise.resolve(document.exitFullscreen()).catch(() => {});
          } else if (document.documentElement.requestFullscreen) {
            Promise.resolve(document.documentElement.requestFullscreen()).catch(() => {});
          }
        } catch (e) { console.warn("Fullscreen unavailable:", e); }
      };
      document.getElementById("switch-player").onclick = () => {
        settingsMenu.style.display = "none";
        if (window.game_unsaved) {
          if (!confirm("Unsaved progress may be lost. Switch player anyway?\n（セーブしていない進行は失われる可能性があります）")) return;
        }
        location.reload();
      };
      let noticeTimer = null;
      function noticeMessage(message) {
        // Non-fatal notice: reuse the loading message area briefly instead of
        // hijacking the fatal-error overlay.  Overlapping notices reset the
        // timer instead of racing each other.
        loadingMessage.textContent = message;
        loadingMessage.style.display = "block";
        if (noticeTimer !== null) clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => {
          noticeTimer = null;
          if (!errorShown) loadingMessage.style.display = "none";
        }, 6000);
      }
      document.getElementById("export-saves").onclick = async () => {
        // Guard the CDN dependencies and the pre-boot state so a menu click
        // can never surface as a fatal-looking uncaught error.
        if (typeof JSZip === "undefined" || typeof saveAs === "undefined") {
          noticeMessage("エクスポート用ライブラリを読み込めていません。接続を確認して再読み込みしてください。 / Export libraries did not load. Reload and try again.");
          return;
        }
        if (!window.Module || !Module.FS || !booted) {
          noticeMessage("ゲーム起動後にお使いください。 / Start the game first, then export.");
          return;
        }
        try {
          const zip = new JSZip();
          function isRealDir(p) { return p !== "." && p !== ".."; }
          function recurse(fs_path, zip_path) {
            const entries = Module.FS.readdir(fs_path).filter(isRealDir);
            for (const entry of entries) {
              const efs = fs_path + "/" + entry, ezp = zip_path + "/" + entry;
              const stat = FS.stat(efs);
              if (FS.isDir(stat.mode)) recurse(efs, ezp);
              else if (FS.isFile(stat.mode)) zip.file(ezp, FS.readFile(efs, { encoding: "binary" }));
            }
          }
          const saveRoot = window.CDDA_PROFILE
            ? "/home/" + window.CDDA_PROFILE + "/.cataclysm-dda"
            : "/home/web_user/.cataclysm-dda";
          recurse(saveRoot, "");
          saveAs(await zip.generateAsync({ type: "blob" }), "saves-" + (window.CDDA_PROFILE || "default") + ".zip");
        } catch (error) {
          console.error("Export failed:", error);
          noticeMessage("エクスポートに失敗しました: " + error + " / Export failed.");
        }
      };

      /* Migrate the prior English default to Japanese exactly once per
         profile, but never overwrite a language selected afterwards.
         Returns true when files were changed so the caller can persist. */
      function migrateJapaneseDefault(fs, configDir) {
        const optionsPath = configDir + "/options.json";
        const migrationPath = configDir + "/.web-ja-default-v3";
        if (fs.analyzePath(migrationPath).exists) return false;

        fs.mkdirTree(configDir);
        let options = [];
        if (fs.analyzePath(optionsPath).exists) {
          try {
            const saved = JSON.parse(fs.readFile(optionsPath, { encoding: "utf8" }));
            if (Array.isArray(saved)) options = saved;
          } catch (error) {
            console.warn("Could not read saved CDDA options; using defaults.", error);
          }
        }

        const languageOption = options.find((option) => option && option.name === "USE_LANG");
        if (!languageOption) {
          options.push({ name: "USE_LANG", value: "ja" });
        } else if (!languageOption.value || languageOption.value === "en") {
          languageOption.value = "ja";
        }

        fs.writeFile(optionsPath, JSON.stringify(options));
        fs.writeFile(migrationPath, "v3\n");
        return true;
      }

      /* The runtime mounts IDBFS over HOME/.cataclysm-dda and restores
         IndexedDB content *after* preRun; anything written there earlier
         would be shadowed by the mount.  This hook (called by the patched
         runtime right after syncfs(true)) is the first moment the real
         persistent config is visible.  Returning true persists changes. */
      window.CDDA_ON_IDBFS_MOUNTED = function (mountPoint) {
        const fs = Module.FS || FS;
        return migrateJapaneseDefault(fs, mountPoint + "/config");
      };

      /* Called by the patched runtime when IndexedDB is unavailable (storage
         pressure, private browsing, corrupted DB).  The game continues on
         in-memory storage; make that visible instead of failing silently. */
      window.CDDA_ON_IDBFS_ERROR = function (detail) {
        console.warn("IDBFS unavailable:", detail);
        noticeMessage(
          "\u6ce8\u610f: \u3053\u306e\u30d6\u30e9\u30a6\u30b6\u3067\u306f\u30bb\u30fc\u30d6\u3092\u4fdd\u5b58\u3067\u304d\u307e\u305b\u3093\uff08\u518d\u8aad\u307f\u8fbc\u307f\u3067\u6d88\u3048\u307e\u3059\uff09\u3002 / " +
          "Warning: saves cannot be persisted in this browser session.");
      };

      var Module = {
        preRun: [function () {
          const profile = window.CDDA_PROFILE || "web_user";
          const home = "/home/" + profile;
          // Emscripten's generated runtime keeps its actual getenv() state in
          // the live global ENV object; Module.ENV is not imported into it.
          // Set this during preRun, before CDDA initializes PATH_INFO and
          // mounts IDBFS at getenv("HOME")/.cataclysm-dda.
          if (typeof ENV === "object") {
            ENV.HOME = home;
            ENV.XDG_CONFIG_HOME = home + "/.config";
            ENV.LANG = "ja_JP.UTF-8";
            ENV.LANGUAGE = "ja";
          }
          // The XDG path is not IDBFS-mounted (only used by USE_XDG_DIR
          // builds); seed it here so either compile configuration starts in
          // Japanese.  The HOME path is handled by the post-mount hook above.
          const fs = Module.FS || FS;
          migrateJapaneseDefault(fs, home + "/.config/cataclysm-dda");
        }],
        postRun: [],
        ENV: (function () {
          const env = {};
          if (window.CDDA_PROFILE) env.HOME = "/home/" + window.CDDA_PROFILE;
          return env;
        })(),
        canvas: (function () {
          canvas.addEventListener("webglcontextlost", function (e) {
            showFatalError("WebGL context lost",
              "描画コンテキストが失われました。ページを再読み込みしてください。\nThe browser dropped the WebGL context (usually memory pressure). Reload the page.");
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function (text) {
          if (text) loadingMessage.innerHTML = text;
          else loadingMessage.innerHTML = "Starting...";
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left
            ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")"
            : "All downloads complete.");
        },
      };
      Module.setStatus("Downloading...");

      /* ---- Error reporting: never a blocking alert(); show a readable
         overlay with a recovery hint instead.  On 4GB Chromebooks the most
         common failures are memory-growth aborts and tab discards, which
         previously surfaced as a black screen with no menu. ---- */
      const errorOverlay = document.getElementById("error-overlay");
      const errorHint = document.getElementById("error-hint");
      const errorDetail = document.getElementById("error-detail");
      let errorShown = false;
      function showFatalError(kind, detail) {
        console.error("[CDDA-SHELL] " + kind + ":", detail);
        if (errorShown) return; // keep the first (root) cause visible
        errorShown = true;
        const text = String(detail || "");
        let hint =
          "再読み込みで直ることが多いです。改善しない場合は他のタブを全て閉じてからやり直してください。<br />" +
          "Reloading usually fixes this. If not, close all other tabs and try again.";
        if (/memory|allocat|OOM|grow/i.test(text)) {
          hint =
            "メモリ不足の可能性があります。他のタブやアプリを閉じてから再読み込みしてください。<br />" +
            "Likely out of memory. Close other tabs/apps, then reload.";
        }
        errorHint.innerHTML = hint;
        errorDetail.textContent = kind + "\n" + text;
        errorOverlay.style.display = "block";
        loadingMessage.style.display = "none";
      }
      window.onerror = function (event, source, lineno, colno, error) {
        let detail = error;
        if (typeof error === "number" && Module.getExceptionMessage) {
          try { detail = Module.getExceptionMessage(error); } catch (e) { /* keep number */ }
        }
        showFatalError("Uncaught exception", detail && detail.stack ? detail.stack : detail || event);
        return true;
      };
      window.addEventListener("unhandledrejection", (e) => {
        showFatalError("Unhandled promise rejection", e.reason && e.reason.stack ? e.reason.stack : e.reason);
      });
      Module.onAbort = function (what) {
        showFatalError("Runtime abort", what);
      };
      window.onbeforeunload = (e) => { if (window.game_unsaved) e.preventDefault(); };
    </script>
  </body>
</html>
