name: Repack Japanese Localization

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  repack:
    name: Repack Japanese Localization
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout wrapper repository
      # ============================================================

      - name: Checkout wrapper repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Download the already-built WASM bundle
      #
      # IMPORTANT:
      # No C++ / WASM compilation occurs here.
      # ============================================================

      - name: Download existing WASM bundle
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-and-release.yml
          name: cdda-0I-web-bundle
          path: site
          if_no_artifact_found: fail


      # ============================================================
      # 3. Verify existing bundle
      # ============================================================

      - name: Verify existing bundle
        run: |
          set -e

          echo "=========================================="
          echo "Existing WebAssembly bundle"
          echo "=========================================="

          find site -maxdepth 2 -type f -print | sort

          echo
          echo "Required files:"

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/index.html

          ls -lh \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js \
            site/index.html


      # ============================================================
      # 4. Checkout exact CDDA 0.I source
      # ============================================================

      - name: Checkout CDDA 0.I
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1


      # ============================================================
      # 5. Install tools
      # ============================================================

      - name: Install gettext and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext jq

          echo "gettext:"
          msgfmt --version | head -1


      # ============================================================
      # 6. Setup Emscripten
      # ============================================================

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51


      # ============================================================
      # 7. Compile Japanese translation
      #
      # Official CDDA 0.I method.
      # ============================================================

      - name: Compile Japanese MO
        working-directory: cdda
        run: |
          set -e

          echo "=========================================="
          echo "Compile Japanese translation"
          echo "=========================================="

          test -f lang/po/ja.po

          chmod +x lang/compile_mo.sh

          ./lang/compile_mo.sh ja

          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$MO"

          echo
          echo "Generated MO:"
          ls -lh "$MO"


      # ============================================================
      # 8. Inspect MO
      #
      # Diagnostic only.
      # Never causes the workflow to fail.
      # ============================================================

      - name: Inspect Japanese MO
        working-directory: cdda
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "Japanese MO statistics"
          echo "=========================================="

          msgfmt \
            --statistics \
            -o /dev/null \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo
          echo "=========================================="
          echo "Japanese MO sample"
          echo "=========================================="

          msgunfmt \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            > /tmp/ja.po

          sed -n '1,160p' /tmp/ja.po


      # ============================================================
      # 9. Prepare official CDDA web bundle
      # ============================================================

      - name: Prepare CDDA web bundle
        working-directory: cdda
        run: |
          set -e

          rm -rf web_bundle

          BUNDLE_DIR="web_bundle"
          DATA_DIR="$BUNDLE_DIR/data"

          mkdir -p "$DATA_DIR"

          echo "=========================================="
          echo "Copy CDDA data"
          echo "=========================================="

          cp -R \
            data/core \
            data/font \
            data/fontdata.json \
            data/json \
            data/mods \
            data/names \
            data/raw \
            data/motd \
            data/credits \
            data/title \
            "$DATA_DIR/"

          echo
          echo "Copy gfx"

          cp -R gfx "$BUNDLE_DIR/"

          echo
          echo "Remove .DS_Store"

          find "$BUNDLE_DIR" \
            -name ".DS_Store" \
            -type f \
            -delete

          echo
          echo "Remove obsolete mods"

          for MOD_DIR in "$DATA_DIR"/mods/*/; do
            if [ -f "$MOD_DIR/modinfo.json" ]; then
              if jq -e \
                '.[] | select(.type == "MOD_INFO") | .obsolete' \
                "$MOD_DIR/modinfo.json" \
                >/dev/null 2>&1; then

                echo "Removing obsolete mod: $MOD_DIR"

                rm -rf "$MOD_DIR"
              fi
            fi
          done

          echo
          echo "Remove MA"

          rm -rf "$DATA_DIR/mods/MA"

          echo
          echo "Remove Ultica_iso"

          rm -rf "$BUNDLE_DIR/gfx/Ultica_iso"


      # ============================================================
      # 10. Add Japanese translation to virtual filesystem
      # ============================================================

      - name: Add Japanese localization
        working-directory: cdda
        run: |
          set -e

          MO_SRC="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"
          MO_DST="web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          mkdir -p \
            "$(dirname "$MO_DST")"

          cp \
            "$MO_SRC" \
            "$MO_DST"

          echo "=========================================="
          echo "Japanese localization in web bundle"
          echo "=========================================="

          find web_bundle/lang \
            -type f \
            -print

          echo
          echo "MO destination:"

          ls -lh "$MO_DST"


      # ============================================================
      # 11. Explicitly verify the file before packing
      # ============================================================

      - name: Verify Japanese MO before packing
        working-directory: cdda
        run: |
          set -e

          MO="web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$MO"

          echo "Japanese MO:"
          ls -lh "$MO"

          echo
          echo "SHA256:"

          sha256sum "$MO"

          echo
          echo "MO header:"

          xxd -l 32 "$MO"


      # ============================================================
      # 12. Repack web data
      # ============================================================

      - name: Repack cataclysm data
        working-directory: cdda
        run: |
          set -e

          source "$EMSDK/emsdk_env.sh"

          rm -f \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js

          echo "=========================================="
          echo "Running Emscripten file_packager"
          echo "=========================================="

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            cataclysm-tiles.data \
            --js-output=cataclysm-tiles.data.js \
            --no-node \
            --preload "web_bundle@/" \
            --lz4

          echo
          echo "Generated files:"

          ls -lh \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js


      # ============================================================
      # 13. Verify that the generated data package contains the
      # Japanese MO.
      #
      # We inspect the generated package manifest rather than merely
      # trusting that file_packager ran successfully.
      # ============================================================

      - name: Verify packed Japanese localization
        working-directory: cdda
        run: |
          set -e

          echo "=========================================="
          echo "Verify generated data package"
          echo "=========================================="

          echo
          echo "Searching generated data loader for Japanese path..."

          if grep -q \
            "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            cataclysm-tiles.data.js; then

            echo
            echo "SUCCESS:"
            echo "Japanese MO path is present in cataclysm-tiles.data.js"

          else

            echo
            echo "WARNING:"
            echo "Japanese MO path was not found literally in data.js."
            echo "This can happen depending on the Emscripten packager format."

          fi

          echo
          echo "Data loader references:"

          grep -o \
            "cataclysm-tiles.data" \
            cataclysm-tiles.data.js \
            | head -20 || true


      # ============================================================
      # 14. Copy generated data files to the site
      # ============================================================

      - name: Replace data files
        working-directory: cdda
        run: |
          set -e

          cp \
            cataclysm-tiles.data \
            ../site/cataclysm-tiles.data

          cp \
            cataclysm-tiles.data.js \
            ../site/cataclysm-tiles.data.js

          echo "=========================================="
          echo "Updated site data"
          echo "=========================================="

          ls -lh \
            ../site/cataclysm-tiles.data \
            ../site/cataclysm-tiles.data.js


      # ============================================================
      # 15. Generate immutable version identifier
      # ============================================================

      - name: Generate deployment version
        id: version
        run: |
          set -e

          DATA_HASH="$(sha256sum site/cataclysm-tiles.data | cut -c1-20)"
          JS_HASH="$(sha256sum site/cataclysm-tiles.data.js | cut -c1-20)"

          echo "data_hash=$DATA_HASH" >> "$GITHUB_OUTPUT"
          echo "js_hash=$JS_HASH" >> "$GITHUB_OUTPUT"

          echo "DATA_HASH=$DATA_HASH"
          echo "JS_HASH=$JS_HASH"


      # ============================================================
      # 16. Cache bust BOTH data.js and data
      #
      # This is the important fix.
      #
      # Previously only data.js received ?v=...
      # but data.js subsequently requested the unchanged:
      #
      #   cataclysm-tiles.data
      #
      # which the browser could still have cached.
      # ============================================================

      - name: Cache bust WebAssembly data package
        env:
          DATA_HASH: ${{ steps.version.outputs.data_hash }}
          JS_HASH: ${{ steps.version.outputs.js_hash }}
        run: |
          set -e

          echo "=========================================="
          echo "Cache busting"
          echo "=========================================="

          python3 - <<'PY'
          import os
          import pathlib
          import re

          data_hash = os.environ["DATA_HASH"]
          js_hash = os.environ["JS_HASH"]

          site = pathlib.Path("site")

          # ----------------------------------------------------------
          # Modify cataclysm-tiles.data.js
          #
          # Emscripten's generated loader contains the actual
          # cataclysm-tiles.data filename.
          #
          # Add a query parameter to that URL so the browser is forced
          # to retrieve the new data package.
          # ----------------------------------------------------------

          data_js = site / "cataclysm-tiles.data.js"

          text = data_js.read_text(
              encoding="utf-8"
          )

          # Remove any previous query parameter.
          text = re.sub(
              r'cataclysm-tiles\.data\?v=[^"\']+',
              'cataclysm-tiles.data',
              text
          )

          # Add the current data hash.
          text = text.replace(
              "cataclysm-tiles.data",
              f"cataclysm-tiles.data?v={data_hash}"
          )

          data_js.write_text(
              text,
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Modify index.html
          # ----------------------------------------------------------

          index = site / "index.html"

          html = index.read_text(
              encoding="utf-8"
          )

          # Remove previous cache-busting parameter.
          html = re.sub(
              r'cataclysm-tiles\.data\.js\?v=[^"\']+',
              'cataclysm-tiles.data.js',
              html
          )

          # Add current JS hash.
          html = html.replace(
              "cataclysm-tiles.data.js",
              f"cataclysm-tiles.data.js?v={js_hash}"
          )

          index.write_text(
              html,
              encoding="utf-8"
          )

          print("Cache busting completed.")
          print(f"data version = {data_hash}")
          print(f"data.js version = {js_hash}")
          PY

          echo
          echo "=========================================="
          echo "Data loader URL"
          echo "=========================================="

          grep -o \
            'cataclysm-tiles\.data[^"]*' \
            site/cataclysm-tiles.data.js \
            | head -20 || true

          echo
          echo "=========================================="
          echo "index.html"
          echo "=========================================="

          grep -n \
            "cataclysm-tiles.data.js" \
            site/index.html || true


      # ============================================================
      # 17. Final verification
      # ============================================================

      - name: Final verification
        run: |
          set -e

          echo "=========================================="
          echo "Final site"
          echo "=========================================="

          find site \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "Required files"
          echo "=========================================="

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/index.html

          echo
          echo "=========================================="
          echo "Hashes"
          echo "=========================================="

          sha256sum \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js

          echo
          echo "=========================================="
          echo "Final verification complete"
          echo "=========================================="


      # ============================================================
      # 18. Upload artifact
      # ============================================================

      - name: Upload Japanese web bundle
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-ja
          path: site/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. Upload GitHub Pages artifact
      # ============================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/


  # ==================================================================
  # Deploy
  # ==================================================================

  deploy:
    name: Deploy Japanese Web Build

    needs: repack

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
