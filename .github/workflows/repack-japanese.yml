name: Add Japanese Localization to CDDA Web

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  repack:
    name: Repack Japanese localization
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 現在のリポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 既存の成功済みビルド成果物を取得
      - name: Download latest web bundle
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-and-release.yml
          name: cdda-0I-web-bundle
          path: site
          if_no_artifact_found: fail

      # 取得結果を確認
      - name: Verify downloaded web bundle
        run: |
          echo "=== Downloaded site files ==="
          find site -maxdepth 2 -type f -print | sort

          echo
          echo "=== Required files ==="
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm

          ls -lh \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm

      # CDDA 0.I本体を取得
      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      # .po → .mo 変換に必要な gettext を導入
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

          echo "=== gettext ==="
          msgfmt --version | head -1

      # Emscriptenをセットアップ
      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      # 日本語翻訳だけを生成
      # C++ / WASM本体は一切コンパイルしない
      - name: Build Japanese localization
        working-directory: cdda
        run: |
          echo "=== Japanese PO source ==="
          test -f lang/po/ja.po
          ls -lh lang/po/ja.po

          echo
          echo "=== Compile Japanese MO ==="

          make localization \
            LANGUAGES="ja"

          echo
          echo "=== Generated Japanese MO ==="

          test -f \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          ls -lh \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      # Web用データディレクトリを作成
      - name: Build web data bundle with Japanese
        working-directory: cdda
        run: |
          source "$EMSDK/emsdk_env.sh"

          rm -rf web_bundle
          mkdir -p web_bundle

          echo "=== Copy game data ==="

          cp -R \
            data/core \
            data/font \
            data/fontdata.json \
            data/json \
            data/mods \
            data/names \
            data/raw \
            data/motd \
            data/credits \
            data/title \
            web_bundle/

          cp -R gfx web_bundle/

          echo "=== Add Japanese localization ==="

          mkdir -p \
            web_bundle/lang/mo/ja/LC_MESSAGES

          cp \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            web_bundle/lang/mo/ja/LC_MESSAGES/

          echo
          echo "=== Localization in web bundle ==="

          find \
            web_bundle/lang \
            -type f \
            -print

      # 既存のWASM/JSは変更せず、
      # dataとdata.jsだけ日本語入りで作り直す
      - name: Repack cataclysm data with Japanese
        working-directory: cdda
        run: |
          source "$EMSDK/emsdk_env.sh"

          echo "=== Repacking cataclysm-tiles.data ==="

          python3 \
            "$EMSDK/upstream/emscripten/tools/file_packager.py" \
            "../site/cataclysm-tiles.data" \
            --preload web_bundle@/ \
            --js-output="../site/cataclysm-tiles.data.js"

          echo
          echo "=== Repacked files ==="

          ls -lh \
            ../site/cataclysm-tiles.data \
            ../site/cataclysm-tiles.data.js

      # 日本語.moが実際にbundle側に存在することを確認
      - name: Verify Japanese localization
        working-directory: cdda
        run: |
          echo "=== Source MO ==="

          find \
            lang/mo/ja \
            -type f \
            -print

          echo
          echo "=== Web bundle MO ==="

          find \
            web_bundle/lang/mo/ja \
            -type f \
            -print

          echo
          echo "=== Final site ==="

          find site -maxdepth 2 -type f -print | sort

      # 日本語版成果物も保存
      - name: Upload Japanese web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-ja
          path: site/
          if-no-files-found: error
          retention-days: 30

      # GitHub Pages用Artifact
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: repack
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
