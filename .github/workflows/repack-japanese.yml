name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM bundle with Japanese localization
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:

      # ============================================================
      # Checkout wrapper repository
      # ============================================================

      - name: Checkout wrapper repository
        uses: actions/checkout@v4


      # ============================================================
      # Checkout exact CDDA 0.I source
      # ============================================================

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1


      # ============================================================
      # Install required packages
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            gettext \
            ccache

          echo "=== gettext ==="
          msgfmt --version | head -1

          echo
          echo "=== ccache ==="
          ccache --version | head -1


      # ============================================================
      # Setup Emscripten 3.1.51
      # ============================================================

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51
          actions-cache-folder: emsdk-cache-3.1.51


      # ============================================================
      # Configure ccache
      # ============================================================

      - name: Configure ccache
        run: |
          echo "=== ccache configuration ==="

          ccache -M 15G
          ccache --zero-stats

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

          ccache --show-config


      # ============================================================
      # Restore ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-cdda-0I-ja-${{ runner.os }}-${{ hashFiles('.github/workflows/build-and-release.yml') }}
          restore-keys: |
            ccache-cdda-0I-ja-${{ runner.os }}-
            ccache-cdda-0I-


      # ============================================================
      # Compile Japanese translation
      #
      # Do this explicitly before prepare-web.
      # ============================================================

      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -e

          echo "=========================================="
          echo "Compile Japanese translation"
          echo "=========================================="

          test -f lang/po/ja.po

          chmod +x lang/compile_mo.sh

          ./lang/compile_mo.sh ja

          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$MO"

          echo
          echo "Generated Japanese MO:"

          ls -lh "$MO"

          echo
          echo "Translation statistics:"

          msgfmt \
            --statistics \
            -o /dev/null \
            "$MO" || true


      # ============================================================
      # Build WebAssembly
      #
      # IMPORTANT:
      # LOCALIZE=1 explicitly enables localization.
      # LANGUAGES="ja" explicitly includes Japanese.
      # ============================================================

      - name: Build cataclysm-tiles.js
        working-directory: cdda
        env:
          CCACHE_COMPILERCHECK: "string:3.1.51"
          CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_ctime,include_file_mtime"
        run: |
          set -e

          echo "=========================================="
          echo "Build CDDA 0.I WebAssembly"
          echo "=========================================="

          emsdk activate ccache-git-emscripten-64bit || true

          export PATH="${PATH%%:*}/../../ccache/git-emscripten_64bit/bin:$PATH"

          export EM_CONFIG="$EMSDK/.emscripten"

          ccache -M 15G
          ccache --zero-stats

          echo
          echo "=== Build options ==="

          echo "NATIVE=emscripten"
          echo "TILES=1"
          echo "RELEASE=1"
          echo "LOCALIZE=1"
          echo 'LANGUAGES="ja"'

          echo
          echo "=== Starting make ==="

          time make -j$(nproc) \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            CCACHE=1 \
            LINTJSON=0 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            cataclysm-tiles.js

          echo
          echo "=== WASM build complete ==="

          ls -lh \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm

          echo
          echo "=== ccache statistics ==="

          ccache --show-stats


      # ============================================================
      # Prepare web bundle
      #
      # This creates the official CDDA web_bundle.
      # ============================================================

      - name: Prepare web bundle
        working-directory: cdda
        run: |
          set -e

          source "$EMSDK/emsdk_env.sh"

          bash build-scripts/prepare-web.sh

          echo
          echo "=== prepare-web complete ==="

          find web_bundle \
            -maxdepth 3 \
            -type f \
            | head -100


      # ============================================================
      # Add Japanese translation to the WebAssembly virtual FS
      #
      # CDDA 0.I's PATH_INFO::langdir() resolves to:
      #
      #   /lang/mo/
      #
      # therefore the correct path is:
      #
      #   /lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo
      # ============================================================

      - name: Add Japanese localization to web bundle
        working-directory: cdda
        run: |
          set -e

          MO_SRC="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"
          MO_DST="web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$MO_SRC"

          mkdir -p \
            "$(dirname "$MO_DST")"

          cp \
            "$MO_SRC" \
            "$MO_DST"

          echo "=========================================="
          echo "Japanese localization"
          echo "=========================================="

          ls -lh "$MO_DST"

          echo
          echo "SHA256:"

          sha256sum "$MO_DST"


      # ============================================================
      # Verify Japanese translation before packing
      # ============================================================

      - name: Verify Japanese localization
        working-directory: cdda
        run: |
          set -e

          MO="web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$MO"

          echo "=== MO file ==="

          file "$MO"

          echo
          echo "=== MO statistics ==="

          msgfmt \
            --statistics \
            -o /dev/null \
            "$MO"

          echo
          echo "=== Sample translations ==="

          msgunfmt "$MO" > /tmp/ja.po

          grep -n \
            '^msgstr "[^"]\+"' \
            /tmp/ja.po \
            | head -20 || true


      # ============================================================
      # Repack web data with Japanese translation included
      # ============================================================

      - name: Repack WebAssembly data
        working-directory: cdda
        run: |
          set -e

          source "$EMSDK/emsdk_env.sh"

          rm -f \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js

          echo "=========================================="
          echo "Packing web_bundle"
          echo "=========================================="

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            cataclysm-tiles.data \
            --js-output=cataclysm-tiles.data.js \
            --no-node \
            --preload "web_bundle@/" \
            --lz4

          echo
          echo "=== Generated data ==="

          ls -lh \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js


      # ============================================================
      # Verify Japanese MO is represented in generated package
      # ============================================================

      - name: Verify generated data package
        working-directory: cdda
        run: |
          set -e

          echo "=========================================="
          echo "Verify generated data package"
          echo "=========================================="

          grep -q \
            "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            cataclysm-tiles.data.js

          echo
          echo "Japanese MO path found in data loader."

          echo
          echo "Japanese references:"

          grep -n \
            "lang/mo/ja" \
            cataclysm-tiles.data.js \
            | head -20


      # ============================================================
      # Replace upstream shell with our profile-aware shell
      # ============================================================

      - name: Copy profile-aware shell
        run: |
          set -e

          test -f shell/index.html

          cp \
            shell/index.html \
            cdda/build/index.html


      # ============================================================
      # Stage final site
      # ============================================================

      - name: Stage site
        run: |
          set -e

          rm -rf site
          mkdir -p site

          cp -v \
            cdda/build/* \
            site/

          echo
          echo "=== Final site ==="

          ls -lh site/


      # ============================================================
      # Cache-busting
      # ============================================================

      - name: Cache bust WebAssembly data
        run: |
          set -e

          DATA_HASH="$(sha256sum site/cataclysm-tiles.data | cut -c1-20)"
          DATA_JS_HASH="$(sha256sum site/cataclysm-tiles.data.js | cut -c1-20)"

          echo "DATA_HASH=$DATA_HASH"
          echo "DATA_JS_HASH=$DATA_JS_HASH"

          python3 - <<'PY'
          import hashlib
          import pathlib
          import re

          site = pathlib.Path("site")

          data = site / "cataclysm-tiles.data"
          data_js = site / "cataclysm-tiles.data.js"
          index = site / "index.html"

          data_hash = hashlib.sha256(
              data.read_bytes()
          ).hexdigest()[:20]

          data_js_hash = hashlib.sha256(
              data_js.read_bytes()
          ).hexdigest()[:20]

          # --------------------------------------------------------
          # data.js
          # --------------------------------------------------------

          text = data_js.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r'cataclysm-tiles\.data\?v=[^"\']+',
              'cataclysm-tiles.data',
              text
          )

          text = text.replace(
              'cataclysm-tiles.data',
              f'cataclysm-tiles.data?v={data_hash}'
          )

          data_js.write_text(
              text,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # index.html
          # --------------------------------------------------------

          text = index.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r'cataclysm-tiles\.data\.js\?v=[^"\']+',
              'cataclysm-tiles.data.js',
              text
          )

          text = text.replace(
              'cataclysm-tiles.data.js',
              f'cataclysm-tiles.data.js?v={data_js_hash}'
          )

          index.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Data hash:",
              data_hash
          )

          print(
              "Data JS hash:",
              data_js_hash
          )
          PY


      # ============================================================
      # Final verification
      # ============================================================

      - name: Final verification
        run: |
          set -e

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/index.html

          echo
          echo "=== Files ==="

          find site \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "=== SHA256 ==="

          sha256sum \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js

          echo
          echo "=== Japanese package verification ==="

          grep -q \
            "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            site/cataclysm-tiles.data.js

          echo "Japanese localization is packed into the WebAssembly data package."

          echo
          echo "=== BUILD SUCCESS ==="


      # ============================================================
      # Upload raw artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Upload GitHub Pages artifact
      # ============================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/


  # ==================================================================
  # Deploy
  # ==================================================================

  deploy:
    name: Deploy to GitHub Pages

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
