name: Repack Japanese Localization

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  repack:
    name: Add Japanese localization
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest web bundle
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-and-release.yml
          name: cdda-0I-web-bundle
          path: site
          if_no_artifact_found: fail

      - name: Verify downloaded bundle
        run: |
          echo "=== Existing bundle ==="

          find site -maxdepth 2 -type f | sort

          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install gettext and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext jq

          echo "=== gettext ==="
          msgfmt --version | head -1

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Build Japanese MO
        working-directory: cdda
        run: |
          echo "=== Japanese PO ==="

          test -f lang/po/ja.po
          ls -lh lang/po/ja.po

          echo
          echo "=== Compile Japanese localization ==="

          make localization LANGUAGES="ja"

          echo
          echo "=== Generated MO ==="

          find lang/mo/ja -type f -print

          test -f \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Create Web bundle with Japanese
        working-directory: cdda
        run: |
          source "$EMSDK/emsdk_env.sh"

          rm -rf web_bundle
          mkdir -p web_bundle/data

          echo "=== Copy game data ==="

          cp -R \
            data/core \
            data/font \
            data/fontdata.json \
            data/json \
            data/mods \
            data/names \
            data/raw \
            data/motd \
            data/credits \
            data/title \
            web_bundle/data/

          cp -R gfx web_bundle/

          echo "=== Add localization directory ==="

          mkdir -p web_bundle/lang/mo

          cp -R \
            lang/mo/ja \
            web_bundle/lang/mo/

          echo
          echo "=== Final localization path ==="

          find web_bundle/lang -type f -print

          test -f \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Repack game data
        working-directory: cdda
        run: |
          source "$EMSDK/emsdk_env.sh"

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            ../site/cataclysm-tiles.data \
            --js-output=../site/cataclysm-tiles.data.js \
            --no-node \
            --preload "web_bundle@/" \
            --lz4

          echo
          echo "=== Repacked data ==="

          ls -lh \
            ../site/cataclysm-tiles.data \
            ../site/cataclysm-tiles.data.js

      - name: Upload Japanese bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-ja
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: repack
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
