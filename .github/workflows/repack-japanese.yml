name: Repack Japanese Localization

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  repack:
    name: Repack Japanese Localization
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout wrapper repository
      # ============================================================

      - name: Checkout wrapper repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Download the already-built WASM bundle
      #
      # IMPORTANT:
      # No C++ / WASM compilation happens in this workflow.
      # ============================================================

      - name: Download latest WASM artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-and-release.yml
          name: cdda-0I-web-bundle
          path: site
          if_no_artifact_found: fail


      # ============================================================
      # 3. Verify existing WASM files
      # ============================================================

      - name: Verify existing WASM bundle
        run: |
          set -e

          echo "=== Existing site ==="

          find site -maxdepth 2 -type f -print | sort

          echo
          echo "=== Required files ==="

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/index.html

          ls -lh \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js \
            site/index.html


      # ============================================================
      # 4. Checkout exact CDDA 0.I source
      # ============================================================

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1


      # ============================================================
      # 5. Install gettext
      #
      # compile_mo.sh uses msgfmt directly.
      # ============================================================

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

          echo "=== gettext version ==="
          msgfmt --version | head -1


      # ============================================================
      # 6. Setup Emscripten
      #
      # Only file_packager is needed.
      # ============================================================

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51


      # ============================================================
      # 7. Verify Japanese PO file
      # ============================================================

      - name: Verify Japanese PO file
        working-directory: cdda
        run: |
          set -e

          echo "=== Japanese PO ==="

          test -f lang/po/ja.po

          ls -lh lang/po/ja.po

          echo
          echo "=== PO header ==="

          sed -n '1,40p' lang/po/ja.po


      # ============================================================
      # 8. Compile Japanese translation using the OFFICIAL script
      #
      # Do NOT use a guessed make target here.
      # ============================================================

      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -e

          echo "=== Official compile_mo.sh ==="

          chmod +x lang/compile_mo.sh

          lang/compile_mo.sh ja

          echo
          echo "=== Generated MO ==="

          test -f \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          ls -lh \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo


      # ============================================================
      # 9. IMPORTANT:
      # Verify that the MO actually contains translations.
      #
      # This prevents a fake "successful" build where the MO exists
      # but contains no translated strings.
      # ============================================================

      - name: Verify Japanese translation contents
        working-directory: cdda
        run: |
          set -e

          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          echo "=== gettext statistics ==="

          msgfmt \
            --statistics \
            -o /dev/null \
            "$MO"

          echo
          echo "=== Number of translated entries ==="

          TRANSLATED=$(
            msgattrib \
              --translated \
              --no-fuzzy \
              "$MO" 2>/dev/null \
              | grep -c '^msgstr' || true
          )

          echo "Translated entries: $TRANSLATED"

          if [ "$TRANSLATED" -lt 10 ]; then
            echo
            echo "ERROR:"
            echo "The Japanese MO contains too few translated entries."
            echo "The PO file may not contain the expected Japanese translations."
            exit 1
          fi

          echo
          echo "Japanese translation data exists."


      # ============================================================
      # 10. Show actual Japanese translations
      #
      # This is useful for diagnosing a successful build that still
      # displays English.
      # ============================================================

      - name: Inspect Japanese translations
        working-directory: cdda
        run: |
          set -e

          echo "=== Sample Japanese translations ==="

          msgunfmt \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            > /tmp/ja.txt

          echo
          echo "--- First translated strings ---"

          awk '
            /^msgid / {
              id=$0
            }

            /^msgstr / {
              if ($0 != "msgstr \"\"" && id != "msgid \"\"") {
                print id
                print $0
                print ""
              }
            }
          ' /tmp/ja.txt | head -80


      # ============================================================
      # 11. Recreate the OFFICIAL web bundle structure
      #
      # This mirrors prepare-web.sh from CDDA 0.I.
      # ============================================================

      - name: Prepare web bundle
        working-directory: cdda
        run: |
          set -e

          rm -rf web_bundle

          BUNDLE_DIR="web_bundle"
          DATA_DIR="$BUNDLE_DIR/data"

          mkdir -p "$DATA_DIR"

          echo "=== Copy official game data ==="

          cp -R \
            data/core \
            data/font \
            data/fontdata.json \
            data/json \
            data/mods \
            data/names \
            data/raw \
            data/motd \
            data/credits \
            data/title \
            "$DATA_DIR/"

          cp -R gfx "$BUNDLE_DIR/"

          echo
          echo "=== Remove .DS_Store ==="

          find "$BUNDLE_DIR" \
            -name ".DS_Store" \
            -type f \
            -delete

          echo
          echo "=== Remove obsolete mods ==="

          for MOD_DIR in "$DATA_DIR"/mods/*/; do
            if [ -f "$MOD_DIR/modinfo.json" ]; then
              if jq -e \
                '.[] | select(.type == "MOD_INFO") | .obsolete' \
                "$MOD_DIR/modinfo.json" \
                >/dev/null 2>&1; then

                echo "$MOD_DIR is obsolete."

                rm -rf "$MOD_DIR"
              fi
            fi
          done

          echo
          echo "=== Remove MA mod ==="

          rm -rf "$DATA_DIR/mods/MA"

          echo
          echo "=== Remove Ultica_iso ==="

          rm -rf "$BUNDLE_DIR/gfx/Ultica_iso"


      # ============================================================
      # 12. Add Japanese localization
      #
      # PATH_INFO::langdir() in CDDA 0.I:
      #
      #   lang/mo/
      #
      # Therefore the final path is:
      #
      #   /lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo
      # ============================================================

      - name: Add Japanese localization to web bundle
        working-directory: cdda
        run: |
          set -e

          mkdir -p \
            web_bundle/lang/mo/ja/LC_MESSAGES

          cp \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo "=== Japanese localization in bundle ==="

          find \
            web_bundle/lang/mo/ja \
            -type f \
            -ls

          test -f \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo


      # ============================================================
      # 13. Repack ONLY the data
      #
      # Existing cataclysm-tiles.js and .wasm remain untouched.
      # ============================================================

      - name: Repack cataclysm data
        working-directory: cdda
        run: |
          set -e

          source "$EMSDK/emsdk_env.sh"

          echo "=== Repacking ==="

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            cataclysm-tiles.data \
            --js-output=cataclysm-tiles.data.js \
            --no-node \
            --preload "$BUNDLE_DIR""@/" \
            --lz4


      # ============================================================
      # 14. Copy newly generated data files to site
      # ============================================================

      - name: Replace data files
        working-directory: cdda
        run: |
          set -e

          cp \
            cataclysm-tiles.data \
            ../site/cataclysm-tiles.data

          cp \
            cataclysm-tiles.data.js \
            ../site/cataclysm-tiles.data.js

          echo "=== New data files ==="

          ls -lh \
            ../site/cataclysm-tiles.data \
            ../site/cataclysm-tiles.data.js


      # ============================================================
      # 15. Verify the generated data.js references the data file
      # ============================================================

      - name: Verify data loader
        run: |
          set -e

          echo "=== cataclysm-tiles.data.js ==="

          grep -o \
            'cataclysm-tiles\.data' \
            site/cataclysm-tiles.data.js \
            | head


      # ============================================================
      # 16. Cache-bust the generated web files
      #
      # This is important because the browser may otherwise keep the
      # old .data / .data.js from the previous deployment.
      # ============================================================

      - name: Add cache bust to index.html
        run: |
          set -e

          VERSION=$(sha256sum site/cataclysm-tiles.data | cut -c1-16)

          echo "Cache version: $VERSION"

          python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]

          path = pathlib.Path("site/index.html")
          text = path.read_text(encoding="utf-8")

          # Add a query parameter to references to the generated data
          # loader.  Existing query strings are preserved.
          text = re.sub(
              r'cataclysm-tiles\.data\.js(?:\?[^"\']*)?',
              f'cataclysm-tiles.data.js?v={version}',
              text
          )

          path.write_text(text, encoding="utf-8")

          print(f"Cache bust version: {version}")
          PY

          echo
          echo "=== Data loader references ==="

          grep -n \
            "cataclysm-tiles.data.js" \
            site/index.html || true


      # ============================================================
      # 17. Final verification
      # ============================================================

      - name: Final verification
        run: |
          set -e

          echo "=== Final site ==="

          find site -maxdepth 2 -type f -print | sort

          echo
          echo "=== File sizes ==="

          ls -lh site/

          echo
          echo "=== Required files ==="

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/index.html

          echo
          echo "=== Japanese MO was packed ==="

          # Verify that the string appears in the generated data.js
          # is not reliable because the actual contents are compressed,
          # so verify the data file changed and the source bundle exists.
          sha256sum \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js


      # ============================================================
      # 18. Upload Japanese artifact
      # ============================================================

      - name: Upload Japanese web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-ja
          path: site/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. GitHub Pages artifact
      # ============================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/


  # ================================================================
  # Deploy
  # ================================================================

  deploy:
    name: Deploy Japanese Web Build
    needs: repack
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
