name: Repack Japanese Localization

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  repack:
    name: Repack Japanese Localization
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # Checkout wrapper repository
      # ============================================================

      - name: Checkout wrapper repository
        uses: actions/checkout@v4


      # ============================================================
      # Download the existing successful WASM build.
      #
      # No C++ / WASM compilation happens in this workflow.
      # ============================================================

      - name: Download existing WASM bundle
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-and-release.yml
          name: cdda-0I-web-bundle
          path: site
          if_no_artifact_found: fail


      # ============================================================
      # Verify the existing build.
      # ============================================================

      - name: Verify existing bundle
        run: |
          set -e

          echo "=== Existing site files ==="
          find site -maxdepth 2 -type f -print | sort

          echo
          echo "=== Required files ==="

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/index.html

          ls -lh \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js \
            site/index.html


      # ============================================================
      # Checkout exact CDDA 0.I source.
      # ============================================================

      - name: Checkout CDDA 0.I
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1


      # ============================================================
      # Install required tools.
      # ============================================================

      - name: Install gettext and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext jq

          echo "=== gettext ==="
          msgfmt --version | head -1


      # ============================================================
      # Setup the same Emscripten version used by the main build.
      # ============================================================

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51


      # ============================================================
      # Compile Japanese .po -> .mo
      #
      # This uses CDDA's official script.
      # ============================================================

      - name: Compile Japanese localization
        working-directory: cdda
        run: |
          set -e

          echo "=== Japanese PO file ==="

          test -f lang/po/ja.po

          ls -lh lang/po/ja.po

          echo
          echo "=== Compile using official CDDA script ==="

          chmod +x lang/compile_mo.sh

          ./lang/compile_mo.sh ja

          echo
          echo "=== Generated MO file ==="

          test -f \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          ls -lh \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo


      # ============================================================
      # Display actual MO contents.
      #
      # IMPORTANT:
      # This is diagnostic only.
      # It NEVER fails the workflow.
      # ============================================================

      - name: Inspect Japanese MO
        working-directory: cdda
        continue-on-error: true
        run: |
          echo "=== MO statistics ==="

          msgfmt \
            --statistics \
            -o /dev/null \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo
          echo "=== Sample translations ==="

          msgunfmt \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            > /tmp/ja.po

          sed -n '1,160p' /tmp/ja.po


      # ============================================================
      # Prepare the web bundle.
      #
      # This follows CDDA 0.I's prepare-web.sh structure.
      # ============================================================

      - name: Prepare CDDA web bundle
        working-directory: cdda
        run: |
          set -e

          rm -rf web_bundle

          BUNDLE_DIR="web_bundle"
          DATA_DIR="$BUNDLE_DIR/data"

          mkdir -p "$DATA_DIR"

          echo "=== Copy CDDA data ==="

          cp -R \
            data/core \
            data/font \
            data/fontdata.json \
            data/json \
            data/mods \
            data/names \
            data/raw \
            data/motd \
            data/credits \
            data/title \
            "$DATA_DIR/"

          echo
          echo "=== Copy gfx ==="

          cp -R gfx "$BUNDLE_DIR/"

          echo
          echo "=== Remove .DS_Store ==="

          find "$BUNDLE_DIR" \
            -name ".DS_Store" \
            -type f \
            -delete

          echo
          echo "=== Remove obsolete mods ==="

          for MOD_DIR in "$DATA_DIR"/mods/*/; do
            if [ -f "$MOD_DIR/modinfo.json" ]; then
              if jq -e \
                '.[] | select(.type == "MOD_INFO") | .obsolete' \
                "$MOD_DIR/modinfo.json" \
                >/dev/null 2>&1; then

                echo "$MOD_DIR is obsolete."

                rm -rf "$MOD_DIR"
              fi
            fi
          done

          echo
          echo "=== Remove MA mod ==="

          rm -rf "$DATA_DIR/mods/MA"

          echo
          echo "=== Remove Ultica_iso ==="

          rm -rf "$BUNDLE_DIR/gfx/Ultica_iso"


      # ============================================================
      # Add Japanese localization.
      #
      # CDDA 0.I expects:
      #
      #   lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo
      #
      # inside the virtual filesystem.
      # ============================================================

      - name: Add Japanese localization to web bundle
        working-directory: cdda
        run: |
          set -e

          mkdir -p \
            web_bundle/lang/mo/ja/LC_MESSAGES

          cp \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo "=== Japanese localization path ==="

          find \
            web_bundle/lang \
            -type f \
            -print

          echo
          echo "=== File ==="

          ls -lh \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo


      # ============================================================
      # Repack only the data.
      #
      # Existing JS and WASM are NOT rebuilt.
      # ============================================================

      - name: Repack cataclysm data
        working-directory: cdda
        run: |
          set -e

          source "$EMSDK/emsdk_env.sh"

          echo "=== Repacking data ==="

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            cataclysm-tiles.data \
            --js-output=cataclysm-tiles.data.js \
            --no-node \
            --preload "web_bundle@/" \
            --lz4

          echo
          echo "=== New data files ==="

          ls -lh \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js


      # ============================================================
      # Replace only the data files.
      # ============================================================

      - name: Replace data files in site
        working-directory: cdda
        run: |
          set -e

          cp \
            cataclysm-tiles.data \
            ../site/cataclysm-tiles.data

          cp \
            cataclysm-tiles.data.js \
            ../site/cataclysm-tiles.data.js

          echo "=== Updated site ==="

          ls -lh \
            ../site/cataclysm-tiles.data \
            ../site/cataclysm-tiles.data.js


      # ============================================================
      # Create a deployment version.
      #
      # This is used only to make the browser request a fresh
      # data-loader file.
      # ============================================================

      - name: Generate deployment version
        id: version
        run: |
          VERSION="$(sha256sum site/cataclysm-tiles.data | cut -c1-16)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Deployment version: $VERSION"


      # ============================================================
      # Cache bust index.html.
      #
      # Only modify references to cataclysm-tiles.data.js.
      # ============================================================

      - name: Cache bust data loader
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]

          path = pathlib.Path("site/index.html")

          text = path.read_text(encoding="utf-8")

          # Remove an existing version query from the data loader.
          text = re.sub(
              r'cataclysm-tiles\.data\.js\?v=[^"\']*',
              'cataclysm-tiles.data.js',
              text
          )

          # Add the current data hash.
          text = re.sub(
              r'cataclysm-tiles\.data\.js(?!\?)',
              f'cataclysm-tiles.data.js?v={version}',
              text
          )

          path.write_text(text, encoding="utf-8")

          print(f"Cache bust version: {version}")
          PY

          echo
          echo "=== index.html references ==="

          grep -n \
            "cataclysm-tiles.data.js" \
            site/index.html || true


      # ============================================================
      # Final verification.
      # ============================================================

      - name: Final verification
        run: |
          set -e

          echo "=== Final files ==="

          find site -maxdepth 2 -type f -print | sort

          echo
          echo "=== Required files ==="

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/index.html

          echo
          echo "=== SHA256 ==="

          sha256sum \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js

          echo
          echo "=== Final verification complete ==="


      # ============================================================
      # Upload artifact.
      # ============================================================

      - name: Upload Japanese web bundle
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-ja
          path: site/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Upload GitHub Pages artifact.
      # ============================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/


  # =================================================================
  # Deploy
  # =================================================================

  deploy:
    name: Deploy Japanese Web Build
    needs: repack
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
