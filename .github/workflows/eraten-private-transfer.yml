name: Transfer verified Eraten snapshot to private repository

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eraten-private-transfer
  cancel-in-progress: false

jobs:
  acquire-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout relay workflow only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout the private destination and its verified transfer script
        uses: actions/checkout@v4
        with:
          repository: "LBTStudio/-"
          ref: main
          token: \${{ secrets.ERATEN_PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Download, verify, extract directly into private checkout
        env:
          ERATEN_SHARE_URL: "https://32.gigafile.nu/0111-hc19ff9a337d787399d294b1c4dff0baa"
          ERATEN_WORK_DIR: \${{ runner.temp }}/eraten-persist-work
          ERATEN_REPO_ROOT: \${{ github.workspace }}/private
        run: python private/scripts/persist_eraten_package.py

      - name: Commit extracted source only to private destination
        working-directory: private
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- game-data/eramegaten_p-0.5.9 game-data/ERATEN_SOURCE_MANIFEST.md
          if git diff --cached --quiet; then
            echo "Verified source snapshot is already present; no commit needed."
          else
            git commit -m "data: persist verified Eraten 0.5.9 source snapshot"
            git push origin HEAD:main
          fi
