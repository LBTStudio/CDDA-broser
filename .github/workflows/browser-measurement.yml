name: CDDA Playwright browser measurements

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public deployed bundle URL (the seven asset hashes are recorded)"
        required: true
        default: "https://lbtstudio.github.io/CDDA-broser/"
        type: string
      scenario:
        description: "Real-game scenario; all runs reading and sleep independently"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "read4"
          - "sleep"
          - "read"
      renderer:
        description: "Renderer setting used by the isolated test profile"
        required: true
        default: "game"
        type: choice
        options:
          - "game"
          - "software"
          - "opengles2"
          - "compare"
      population:
        description: "Optional cloaked monster stress count; nonzero only with sleep scenario"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "32"
          - "64"
          - "128"
          - "200"
      display_profile:
        description: "Chromium viewport and device scale factor; compact profiles approximate Chromebook-sized layouts"
        required: true
        default: "compare"
        type: choice
        options:
          - "desktop"
          - "chromebook-compact"
          - "chromebook-dpr2"
          - "compare"
  workflow_run:
    workflows: ["Build CDDA 0.I WebAssembly"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-measurement.yml"
      - "bench/playwright_game_measurement.mjs"
      - "bench/sample_chromium_memory.sh"
      - "bench/real_activity_fixture.py"
      - "docs/measurements/PLAYWRIGHT.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/browser-measurement.yml"
      - "bench/playwright_game_measurement.mjs"
      - "bench/sample_chromium_memory.sh"
      - "bench/real_activity_fixture.py"
      - "docs/measurements/PLAYWRIGHT.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: cdda-browser-measurement-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  measure:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Playwright real-bundle measurement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CDDA_BASE_URL: ${{ github.event_name == 'workflow_run' && format('https://github.com/LBTStudio/CDDA-broser/actions/runs/{0}', github.event.workflow_run.id) || github.event.inputs.base_url || 'https://lbtstudio.github.io/CDDA-broser/' }}
      CDDA_SCENARIO: ${{ github.event.inputs.scenario || 'all' }}
      CDDA_RENDERER: ${{ github.event.inputs.renderer || 'game' }}
      CDDA_POPULATION: ${{ github.event.inputs.population || '0' }}
      CDDA_DISPLAY_PROFILE: ${{ github.event.inputs.display_profile || 'chromebook-compact' }}
    steps:
      - name: Checkout measurement harness
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright and npm downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: ${{ runner.os }}-cdda-playwright-1.55.0-${{ hashFiles('.github/workflows/browser-measurement.yml') }}
          restore-keys: |
            ${{ runner.os }}-cdda-playwright-1.55.0-

      - name: Install pinned Playwright package
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm init -y
          npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Install pinned Chromium
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Download the exact deployed bundle under test
        if: ${{ github.event_name != 'workflow_run' }}
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://lbtstudio.github.io/CDDA-broser/' }}
        run: |
          set -euo pipefail
          case "$BASE_URL" in
            https://*) ;;
            *) echo "BASE_URL must use https://" >&2; exit 1 ;;
          esac
          BUNDLE="$GITHUB_WORKSPACE/bench/out/browser-measurement/bundle"
          mkdir -p "$BUNDLE"
          BASE_URL="${BASE_URL%/}"
          for asset in index.html cataclysm-tiles.js cataclysm-tiles.wasm cataclysm-tiles.data cataclysm-tiles.data.js Terminus.ttf favicon.ico; do
            echo "[download] $asset"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' "$BASE_URL/$asset" -o "$BUNDLE/$asset"
            test -s "$BUNDLE/$asset"
          done
          (cd "$BUNDLE" && sha256sum *) | tee "$GITHUB_WORKSPACE/bench/out/browser-measurement/bundle-sha256.txt"
          {
            echo "## Downloaded published bundle"
            echo ""
            echo "- Requested URL: $BASE_URL"
            echo "- Harness commit: $GITHUB_SHA"
            echo "- The measurements test the downloaded deployment, not an unbuilt PR's C++ changes."
            echo ""
            sed 's/^/- Asset: /' "$GITHUB_WORKSPACE/bench/out/browser-measurement/bundle-sha256.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download exact bundle from the completed full build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: cdda-0I-web-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: bench/out/browser-measurement/bundle

      - name: Verify full-build artifact and record its fingerprint
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/bench/out/browser-measurement/bundle"
          for asset in index.html cataclysm-tiles.js cataclysm-tiles.wasm cataclysm-tiles.data cataclysm-tiles.data.js Terminus.ttf favicon.ico; do
            test -s "$BUNDLE/$asset" || { echo "::error::Missing full-build artifact asset: $asset"; exit 1; }
          done
          (cd "$BUNDLE" && sha256sum *) | tee "$GITHUB_WORKSPACE/bench/out/browser-measurement/bundle-sha256.txt"
          {
            echo "## Exact WebAssembly build artifact"
            echo ""
            echo "- Source workflow run: https://github.com/LBTStudio/CDDA-broser/actions/runs/${{ github.event.workflow_run.id }}"
            echo "- Source commit: ${{ github.event.workflow_run.head_sha }}"
            echo "- This run tests the build artifact itself, independent of Pages cache/deployment timing."
            echo ""
            sed 's/^/- Asset: /' "$GITHUB_WORKSPACE/bench/out/browser-measurement/bundle-sha256.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run isolated real-game measurements
        id: measure
        run: |
          set -uo pipefail
          BUNDLE="$GITHUB_WORKSPACE/bench/out/browser-measurement/bundle"
          OUT="$GITHUB_WORKSPACE/bench/out/browser-measurement"
          case "$CDDA_SCENARIO" in
            all) scenarios=(read4 sleep) ;;
            read4|read|sleep) scenarios=("$CDDA_SCENARIO") ;;
            *) echo "Unsupported scenario: $CDDA_SCENARIO" >&2; exit 2 ;;
          esac
          case "$CDDA_RENDERER" in
            compare) renderers=(software opengles2) ;;
            game|software|opengles2) renderers=("$CDDA_RENDERER") ;;
            *) echo "Unsupported renderer: $CDDA_RENDERER" >&2; exit 2 ;;
          esac
          case "$CDDA_DISPLAY_PROFILE" in
            compare) display_profiles=(desktop chromebook-compact chromebook-dpr2) ;;
            desktop|chromebook-compact|chromebook-dpr2) display_profiles=("$CDDA_DISPLAY_PROFILE") ;;
            *) echo "Unsupported display profile: $CDDA_DISPLAY_PROFILE" >&2; exit 2 ;;
          esac
          case "$CDDA_POPULATION" in
            0|32|64|128|200) ;;
            *) echo "Unsupported population count: $CDDA_POPULATION" >&2; exit 2 ;;
          esac
          if [[ "$CDDA_POPULATION" != "0" && "$CDDA_SCENARIO" != "sleep" ]]; then
            echo "Population stress mode currently requires scenario=sleep to keep reading benchmarks uncontaminated." >&2
            exit 2
          fi
          echo "- Scenario: $CDDA_SCENARIO; renderer: $CDDA_RENDERER; cloaked monster population: $CDDA_POPULATION; display profiles: ${display_profiles[*]}" >> "$GITHUB_STEP_SUMMARY"
          overall=0
          for scenario in "${scenarios[@]}"; do
            for renderer in "${renderers[@]}"; do
              echo "[fixture] scenario=$scenario renderer=$renderer"
              if ! python3 bench/real_activity_fixture.py "$BUNDLE" "$scenario" "$CDDA_POPULATION" "$renderer"; then
                overall=1
                continue
              fi
              for display_profile in "${display_profiles[@]}"; do
                echo "[fixture] scenario=$scenario renderer=$renderer display_profile=$display_profile"
                node bench/playwright_game_measurement.mjs "$BUNDLE" "$scenario" "$renderer" "$CDDA_BASE_URL" "$CDDA_POPULATION" "$display_profile" &
                runner_pid=$!
                bash bench/sample_chromium_memory.sh "$OUT/chromium-memory-$scenario-$renderer-$display_profile.tsv" "$runner_pid" &
                memory_pid=$!
                if wait "$runner_pid"; then
                  scenario_status=0
                else
                  scenario_status=$?
                  overall=1
                fi
                wait "$memory_pid" || true
                echo "[fixture] scenario=$scenario renderer=$renderer display_profile=$display_profile exit=$scenario_status"
                if [[ -f "$OUT/$scenario-$renderer-$display_profile/summary.md" ]]; then
                  cat "$OUT/$scenario-$renderer-$display_profile/summary.md" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
            done
          done
          exit "$overall"

      - name: Upload measurements, browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdda-playwright-measurement-${{ github.run_id }}
          path: |
            bench/out/browser-measurement/*-*/*
            bench/out/browser-measurement/chromium-memory-*.tsv
            bench/out/browser-measurement/bundle-sha256.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
