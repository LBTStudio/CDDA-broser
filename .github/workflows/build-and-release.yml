name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build CDDA 0.I WebAssembly - Japanese
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            jq \
            gettext

          msgfmt --version | head -1

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Relax link-time optimization
        working-directory: cdda
        run: |
          set -euo pipefail

          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O1/' \
            Makefile

          grep -n "LDFLAGS" Makefile | head -20

      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          test -f lang/po/ja.po

          bash lang/compile_mo.sh ja

          test -s \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo "=== Japanese MO ==="

          ls -lh \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo
          echo "=== Translation statistics ==="

          msgfmt \
            --statistics \
            -o /dev/null \
            lang/po/ja.po

          echo
          echo "=== Verify actual Japanese strings ==="

          if ! msgunfmt \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            | grep -q 'msgstr.*[ぁ-んァ-ヶ一-龯]'
          then
            echo "ERROR: Japanese MO contains no Japanese translations."
            exit 1
          fi

          echo "Japanese translations confirmed."

      - name: Set Japanese as default language
        working-directory: cdda
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/options.cpp")
          text = path.read_text(encoding="utf-8")

          old = 'options_manager::get_lang_options(), "" );'
          new = 'options_manager::get_lang_options(), "ja" );'

          count = text.count(old)

          if count != 1:
              raise SystemExit(
                  f"ERROR: USE_LANG default pattern count = {count}"
              )

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          grep -n \
            'options_manager::get_lang_options(), "ja" );' \
            src/options.cpp

      - name: Force Emscripten locale path to lang/mo
        working-directory: cdda
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/translations.cpp")
          text = path.read_text(encoding="utf-8")

          marker = '''std::string locale_dir()
          {
              std::string loc_dir = PATH_INFO::langdir();
          '''

          replacement = '''std::string locale_dir()
          {
          #if defined(__EMSCRIPTEN__)
              return PATH_INFO::langdir();
          #else
              std::string loc_dir = PATH_INFO::langdir();
          '''

          if marker not in text:
              raise SystemExit(
                  "ERROR: locale_dir patch location not found"
              )

          text = text.replace(
              marker,
              replacement,
              1
          )

          old_end = '''#endif // LOCALIZE
              return loc_dir;
          }'''

          new_end = '''#endif // LOCALIZE
              return loc_dir;
          #endif // __EMSCRIPTEN__
          }'''

          if old_end not in text:
              raise SystemExit(
                  "ERROR: locale_dir patch end not found"
              )

          text = text.replace(
              old_end,
              new_end,
              1
          )

          path.write_text(text, encoding="utf-8")
          PY

          echo "=== Patched locale_dir ==="

          grep -n \
            -A30 \
            -B2 \
            'std::string locale_dir' \
            src/translations.cpp

          grep -q \
            'defined(__EMSCRIPTEN__)' \
            src/translations.cpp

      - name: Patch official prepare-web script for Japanese
        working-directory: cdda
        run: |
          set -euo pipefail

          cp \
            build-scripts/prepare-web.sh \
            build-scripts/prepare-web-ja.sh

          python3 <<'PY'
          from pathlib import Path

          path = Path("build-scripts/prepare-web-ja.sh")
          text = path.read_text(encoding="utf-8")

          target = '''echo "Removing Ultica_iso tileset..."
          rm -rf $BUNDLE_DIR/gfx/Ultica_iso
          '''

          replacement = '''echo "Removing Ultica_iso tileset..."
          rm -rf $BUNDLE_DIR/gfx/Ultica_iso

          echo "Adding Japanese locale..."
          mkdir -p "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES"
          cp \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -s \
            "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"
          '''

          if text.count(target) != 1:
              raise SystemExit(
                  "ERROR: prepare-web patch target not found exactly once"
              )

          text = text.replace(
              target,
              replacement,
              1
          )

          path.write_text(text, encoding="utf-8")
          PY

          grep -n \
            -A15 \
            -B5 \
            'Adding Japanese locale' \
            build-scripts/prepare-web-ja.sh

      - name: Build cataclysm-tiles.js
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          df -h /
          free -h

          time make -j"$(nproc)" \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            CCACHE=0 \
            LINTJSON=0 \
            cataclysm-tiles.js

          test -s cataclysm-tiles.js
          test -s cataclysm-tiles.wasm

          ls -lh \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm

      - name: Prepare web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          bash \
            build-scripts/prepare-web-ja.sh

          echo
          echo "=== Japanese file inside source bundle ==="

          test -s \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          ls -lh \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Verify packaged Japanese locale
        working-directory: cdda
        run: |
          set -euo pipefail

          echo "=== Required build files ==="

          REQUIRED=(
            build/cataclysm-tiles.js
            build/cataclysm-tiles.wasm
            build/cataclysm-tiles.data
            build/cataclysm-tiles.data.js
          )

          for FILE in "${REQUIRED[@]}"; do
            test -s "$FILE"
            echo "OK: $FILE"
          done

          echo
          echo "=== Verify Japanese virtual filesystem entry ==="

          grep -q \
            'lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo' \
            build/cataclysm-tiles.data.js

          echo "Japanese MO path is present in Emscripten loader."

      - name: Copy profile-aware shell
        run: |
          set -euo pipefail

          test -f shell/index.html

          cp \
            shell/index.html \
            cdda/build/index.html

      - name: Stage site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp -a \
            cdda/build/. \
            site/

          find site \
            -maxdepth 2 \
            -type f \
            | sort

          du -sh site/

      - name: Final verification
        run: |
          set -euo pipefail

          REQUIRED=(
            site/index.html
            site/cataclysm-tiles.js
            site/cataclysm-tiles.wasm
            site/cataclysm-tiles.data
            site/cataclysm-tiles.data.js
            site/Terminus.ttf
            site/favicon.ico
          )

          for FILE in "${REQUIRED[@]}"; do
            test -s "$FILE"
            echo "OK: $FILE"
          done

          grep -q \
            'lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo' \
            site/cataclysm-tiles.data.js

          echo "Japanese locale is included in final site."

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-japanese
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
