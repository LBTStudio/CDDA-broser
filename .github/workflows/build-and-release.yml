name: Repack Japanese Localization

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "japanese-pages"
  cancel-in-progress: true

jobs:
  repack:
    name: Add Japanese Localization
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. Checkout wrapper repository
      # ============================================================

      - name: Checkout wrapper repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Download an existing successful WASM build
      #
      # IMPORTANT:
      # No C++ compilation.
      # No WASM compilation.
      # No full web bundle reconstruction.
      # ============================================================

      - name: Download existing successful build
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-and-release.yml
          workflow_conclusion: success
          branch: main
          name: cdda-0I-web-bundle
          path: site
          if_no_artifact_found: fail


      # ============================================================
      # 3. Verify existing game files
      # ============================================================

      - name: Verify existing game files
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY EXISTING BUILD"
          echo "=========================================="

          REQUIRED_FILES=(
            "site/cataclysm-tiles.js"
            "site/cataclysm-tiles.wasm"
            "site/cataclysm-tiles.data"
            "site/cataclysm-tiles.data.js"
            "site/index.html"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            test -f "$FILE"
            echo "OK: $FILE"
          done

          echo
          echo "=== Existing files ==="

          ls -lh \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js \
            site/index.html


      # ============================================================
      # 4. Checkout CDDA 0.I
      #
      # Only the translation source is needed.
      # ============================================================

      - name: Checkout CDDA 0.I translation source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1


      # ============================================================
      # 5. Install gettext + jq
      # ============================================================

      - name: Install gettext
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gettext

          msgfmt --version | head -1
          msgunfmt --version | head -1


      # ============================================================
      # 6. Setup Emscripten
      #
      # Only file_packager is used.
      # No compiler invocation.
      # ============================================================

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51


      # ============================================================
      # 7. Compile Japanese PO -> MO
      # ============================================================

      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COMPILE JAPANESE TRANSLATION"
          echo "=========================================="

          test -f lang/po/ja.po

          chmod +x lang/compile_mo.sh

          ./lang/compile_mo.sh ja

          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$MO"

          echo
          echo "Japanese MO:"
          ls -lh "$MO"

          echo
          echo "SHA256:"
          sha256sum "$MO"

          echo
          echo "Statistics:"

          msgfmt \
            --statistics \
            -o /dev/null \
            "$MO"


      # ============================================================
      # 8. Create a SMALL standalone Japanese data package
      #
      # This package contains ONLY:
      #
      # /lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo
      #
      # The existing cataclysm-tiles.data is NOT touched.
      # ============================================================

      - name: Create Japanese data package
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$MO"

          rm -f \
            cdda-ja.data \
            cdda-ja.data.js

          echo "=========================================="
          echo "CREATE JAPANESE DATA PACKAGE"
          echo "=========================================="

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            cdda-ja.data \
            --js-output=cdda-ja.data.js \
            --no-node \
            --preload "$MO@/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            --lz4

          echo
          echo "=== Japanese package ==="

          ls -lh \
            cdda-ja.data \
            cdda-ja.data.js


      # ============================================================
      # 9. Verify package contents
      # ============================================================

      - name: Verify Japanese data package
        working-directory: cdda
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY JAPANESE PACKAGE"
          echo "=========================================="

          test -f cdda-ja.data
          test -f cdda-ja.data.js

          if ! grep -q \
            "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            cdda-ja.data.js; then

            echo
            echo "ERROR:"
            echo "Japanese MO is not present in cdda-ja.data.js."

            exit 1
          fi

          echo
          echo "SUCCESS:"
          echo "Japanese translation is present in the standalone package."


      # ============================================================
      # 10. Copy Japanese package into site
      # ============================================================

      - name: Install Japanese package into site
        run: |
          set -euo pipefail

          cp \
            cdda/cdda-ja.data \
            site/cdda-ja.data

          cp \
            cdda/cdda-ja.data.js \
            site/cdda-ja.data.js

          echo "=========================================="
          echo "JAPANESE PACKAGE INSTALLED"
          echo "=========================================="

          ls -lh \
            site/cdda-ja.data \
            site/cdda-ja.data.js


      # ============================================================
      # 11. Modify index.html to load the Japanese package
      #
      # Existing game data remains untouched.
      # ============================================================

      - name: Add Japanese data loader
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("site/index.html")
          text = path.read_text(encoding="utf-8")

          old = '''
          const d = document.createElement("script");

          d.async = true; d.src = "cataclysm-tiles.data.js";

          document.body.appendChild(d);

          const g = document.createElement("script");

          g.async = true; g.src = "cataclysm-tiles.js";

          document.body.appendChild(g);
          '''

          new = '''
          const d = document.createElement("script");

          d.async = true;
          d.src = "cataclysm-tiles.data.js";

          document.body.appendChild(d);

          const j = document.createElement("script");

          j.async = true;
          j.src = "cdda-ja.data.js";

          document.body.appendChild(j);

          const g = document.createElement("script");

          g.async = true;
          g.src = "cataclysm-tiles.js";

          document.body.appendChild(g);
          '''

          if old not in text:
              raise SystemExit(
                  "ERROR: Expected boot() loader block was not found."
              )

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          print("Japanese data loader added.")
          PY

          echo
          echo "=== Loader check ==="

          grep -n \
            -E "cataclysm-tiles.data.js|cdda-ja.data.js|cataclysm-tiles.js" \
            site/index.html


      # ============================================================
      # 12. Cache bust Japanese package
      # ============================================================

      - name: Add Japanese package cache version
        run: |
          set -euo pipefail

          VERSION="$(sha256sum site/cdda-ja.data.js | cut -c1-16)"

          echo "Japanese package version: $VERSION"

          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]

          path = Path("site/index.html")

          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'cdda-ja\.data\.js(?:\?[^"\']*)?',
              f'cdda-ja.data.js?v={version}',
              text
          )

          path.write_text(text, encoding="utf-8")
          PY

          grep -n "cdda-ja.data.js" site/index.html


      # ============================================================
      # 13. Verify original WASM/data still exist
      # ============================================================

      - name: Verify original game files remain intact
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL FILE VERIFICATION"
          echo "=========================================="

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/cdda-ja.data
          test -f site/cdda-ja.data.js
          test -f site/index.html

          echo
          echo "=== Final site ==="

          ls -lh site/

          echo
          echo "=== SHA256 ==="

          sha256sum \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js \
            site/cdda-ja.data \
            site/cdda-ja.data.js

          echo
          echo "=========================================="
          echo "JAPANESE LOCALIZATION PACKAGE READY"
          echo "=========================================="


      # ============================================================
      # 14. Upload artifact
      # ============================================================

      - name: Upload Japanese web bundle
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-ja
          path: site/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 15. Upload GitHub Pages artifact
      # ============================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/


  # ================================================================
  # Deploy
  # ================================================================

  deploy:
    name: Deploy Japanese Web Build

    needs: repack

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
