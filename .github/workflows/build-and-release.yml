name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm bundle
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift || true
          df -h /

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      # ==========================================================
      # IMPORTANT:
      # The following step was part of the previously successful
      # build and prevents the final Emscripten link from spending
      # an excessive amount of time in -Os / wasm-opt.
      # ==========================================================

      - name: Relax link-time optimization (-Os -> -O1, link only)
        working-directory: cdda
        run: |
          sed -i 's/^\s*LDFLAGS\s*+=\s*-Os\s*$/    LDFLAGS += -O1/' Makefile

          echo "=== Effective linker optimization ==="
          grep -n "LDFLAGS" Makefile | head -20

      # ==========================================================
      # Japanese localization
      # ==========================================================

      - name: Check Japanese localization
        working-directory: cdda
        run: |
          echo "=== Japanese localization source ==="

          if [ -f lang/po/ja.po ]; then
            ls -lh lang/po/ja.po
          else
            echo "ERROR: lang/po/ja.po was not found."
            echo
            echo "Available localization files:"
            find lang/po -maxdepth 1 -type f | sort
            exit 1
          fi

      # ==========================================================
      # WebAssembly build
      # ==========================================================

      - name: Build cataclysm-tiles.js (wasm + Japanese)
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"
        run: |
          source $EMSDK/emsdk_env.sh

          echo "=== Disk ==="
          df -h /

          echo
          echo "=== Memory ==="
          free -h

          echo
          echo "=== Building CDDA 0.I ==="

          time make -j$(nproc) \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            CCACHE=0 \
            LINTJSON=0 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            cataclysm-tiles.js

          echo
          echo "=== WASM output ==="

          ls -lh cataclysm-tiles.js
          ls -lh cataclysm-tiles.wasm

      # ==========================================================
      # Prepare web bundle
      # ==========================================================

      - name: Prepare web bundle (data + LZ4 pack)
        working-directory: cdda
        run: |
          source $EMSDK/emsdk_env.sh
          bash build-scripts/prepare-web.sh

      # ==========================================================
      # Copy custom shell
      # ==========================================================

      - name: Copy profile-aware shell
        run: |
          cp shell/index.html cdda/build/index.html

      # ==========================================================
      # Stage site
      # ==========================================================

      - name: Stage site
        run: |
          mkdir -p site

          cp -a cdda/build/. site/

          echo "=== Final site contents ==="
          find site -maxdepth 3 -type f | sort

          echo
          echo "=== Site size ==="
          du -sh site/

      # ==========================================================
      # Upload artifacts
      # ==========================================================

      - name: Upload artifact (raw)
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
