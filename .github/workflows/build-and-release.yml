name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51
          actions-cache-folder: emsdk-cache-3.1.51

      - name: Install ccache for emscripten
        run: |
          emsdk install ccache-git-emscripten-64bit
          emsdk activate ccache-git-emscripten-64bit

      - name: Get ccache path
        id: ccache-vars
        run: |
          echo "datetime=$(/bin/date -u '+%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"
          echo "path=$HOME/.cache/ccache" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ steps.ccache-vars.outputs.path }}
          key: ccache-cdda-0I-emscripten-${{ steps.ccache-vars.outputs.datetime }}
          restore-keys: |
            ccache-cdda-0I-emscripten-

      - name: Build cataclysm-tiles.js with Japanese localization
        working-directory: cdda
        run: |
          emsdk activate ccache-git-emscripten-64bit

          export PATH="${PATH%%:*}/../../ccache/git-emscripten_64bit/bin:$PATH"
          export EM_CONFIG="$EMSDK/.emscripten"
          export CCACHE_COMPILERCHECK=string:3.1.51

          ccache -M 15G
          ccache --zero-stats

          echo "=== Japanese localization source ==="
          ls -lah lang/po/ja.po

          echo
          echo "=== Building CDDA WebAssembly with Japanese localization ==="

          make -j$(nproc) \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            CCACHE=1 \
            LINTJSON=0 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            cataclysm-tiles.js

          echo
          echo "=== ccache statistics ==="
          ccache --show-stats

          echo
          echo "=== WASM output ==="
          ls -lh cataclysm-tiles.js cataclysm-tiles.wasm

          echo
          echo "=== Generated Japanese localization ==="
          find lang/mo -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Prepare web bundle
        working-directory: cdda
        run: |
          bash build-scripts/prepare-web.sh

      - name: Copy profile-aware shell over upstream shell
        run: |
          cp shell/index.html cdda/build/index.html

      - name: Verify localization in build
        working-directory: cdda
        run: |
          echo "=== Build directory ==="
          find build -maxdepth 3 -type f | sort

          echo
          echo "=== Japanese localization files ==="
          find . -type f \
            \( -path "*/lang/mo/*" -o -name "*ja*" \) \
            -print

      - name: Stage site
        run: |
          mkdir -p site

          cp -a cdda/build/. site/

          echo "=== Final site ==="
          find site -maxdepth 3 -type f | sort

          echo
          echo "=== Site size ==="
          du -sh site/

      - name: Upload artifact (raw)
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
