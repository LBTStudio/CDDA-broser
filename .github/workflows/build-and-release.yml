name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Japanese-enabled WASM bundle
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            jq \
            gettext

          msgfmt --version | head -1

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Relax link-time optimization
        working-directory: cdda
        run: |
          set -euo pipefail

          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O1/' \
            Makefile

          echo "=== Linker flags ==="
          grep -n "LDFLAGS" Makefile | head -20

      - name: Compile Japanese localization
        working-directory: cdda
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COMPILE JAPANESE LOCALIZATION"
          echo "=========================================="

          test -f lang/po/ja.po

          mkdir -p lang/mo/ja/LC_MESSAGES

          msgfmt \
            -f \
            -o lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            lang/po/ja.po

          test -s lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo
          echo "Japanese translation:"
          ls -lh lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo
          echo "SHA256:"
          sha256sum lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Build cataclysm-tiles.js
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          echo "=========================================="
          echo "BUILD CDDA 0.I"
          echo "=========================================="

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Memory:"
          free -h

          echo
          echo "Localization:"
          echo "LOCALIZE=1"
          echo "LANGUAGES=ja"

          echo
          echo "Starting WASM compilation..."

          time make -j"$(nproc)" \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            CCACHE=0 \
            LINTJSON=0 \
            cataclysm-tiles.js

          echo
          echo "=== WASM output ==="

          test -f cataclysm-tiles.js
          test -f cataclysm-tiles.wasm

          ls -lh \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm

      - name: Prepare web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          bash build-scripts/prepare-web.sh

      - name: Add Japanese locale to web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$MO"

          mkdir -p \
            web_bundle/lang/mo/ja/LC_MESSAGES

          cp \
            "$MO" \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo "Japanese locale added to web_bundle."

          ls -lh \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Repack web data with Japanese locale
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          rm -f \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            cataclysm-tiles.data \
            --js-output=cataclysm-tiles.data.js \
            --no-node \
            --preload "web_bundle@/" \
            --lz4

          test -s cataclysm-tiles.data
          test -s cataclysm-tiles.data.js

          echo
          echo "=== Data package ==="

          ls -lh \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js

      - name: Verify Japanese locale is packaged
        working-directory: cdda
        run: |
          set -euo pipefail

          if ! grep -q \
            "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            cataclysm-tiles.data.js; then

            echo "ERROR: Japanese locale was not included in data package."
            exit 1
          fi

          echo "Japanese locale successfully included."

      - name: Copy profile-aware shell
        run: |
          set -euo pipefail

          test -f shell/index.html

          cp \
            shell/index.html \
            cdda/build/index.html

      - name: Stage site
        run: |
          set -euo pipefail

          mkdir -p site

          cp -a \
            cdda/build/. \
            site/

          echo "=== Site ==="
          find site -maxdepth 3 -type f | sort

      - name: Verify final site
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "site/cataclysm-tiles.js"
            "site/cataclysm-tiles.wasm"
            "site/cataclysm-tiles.data"
            "site/cataclysm-tiles.data.js"
            "site/index.html"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            test -f "$FILE"
            echo "OK: $FILE"
          done

          echo
          echo "=== Japanese locale check ==="

          if ! grep -q \
            "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            site/cataclysm-tiles.data.js; then

            echo "ERROR: Japanese locale missing from final site."
            exit 1
          fi

          echo "OK: Japanese locale present."

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
