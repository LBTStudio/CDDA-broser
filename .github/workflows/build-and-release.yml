name: Repack Japanese Localization

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Build WASM と同じ pages グループにしない。
# 日本語再パックは既存Artifactだけを使うため、独立して動かせる。
concurrency:
  group: "japanese-pages"
  cancel-in-progress: true

jobs:
  repack:
    name: Repack Japanese Localization
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. Wrapper repository
      # ============================================================

      - name: Checkout wrapper repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Get the latest successful WASM build
      #
      # IMPORTANT:
      # This downloads an existing artifact.
      # NO C++ compilation happens here.
      # ============================================================

      - name: Download latest successful WASM build
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-and-release.yml
          workflow_conclusion: success
          branch: main
          name: cdda-0I-web-bundle
          path: site
          if_no_artifact_found: fail


      # ============================================================
      # 3. Verify existing WASM
      # ============================================================

      - name: Verify existing WASM bundle
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Existing WASM bundle"
          echo "=========================================="

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/index.html

          ls -lh \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js \
            site/index.html

          echo
          echo "WASM files will NOT be rebuilt."


      # ============================================================
      # 4. Checkout exact CDDA 0.I source
      # ============================================================

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1


      # ============================================================
      # 5. Install dependencies required by prepare-web.sh
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            jq \
            gettext


      # ============================================================
      # 6. Setup Emscripten
      #
      # Used ONLY for file_packager.
      # No make / C++ / WASM compilation.
      # ============================================================

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51


      # ============================================================
      # 7. Generate the normal CDDA web_bundle
      #
      # This executes the official CDDA 0.I preparation script.
      # It does NOT compile cataclysm-tiles.js.
      # ============================================================

      - name: Prepare CDDA web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          echo "=========================================="
          echo "Running official CDDA 0.I prepare-web.sh"
          echo "=========================================="

          bash build-scripts/prepare-web.sh

          echo
          echo "=== web_bundle ==="

          du -sh web_bundle

          find web_bundle -maxdepth 2 -type d | sort | head -100


      # ============================================================
      # 8. Compile Japanese MO
      # ============================================================

      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Compile Japanese translation"
          echo "=========================================="

          test -f lang/po/ja.po

          chmod +x lang/compile_mo.sh

          ./lang/compile_mo.sh ja

          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$MO"

          echo
          echo "Japanese MO:"
          ls -lh "$MO"

          echo
          echo "Translation statistics:"
          msgfmt \
            --statistics \
            -o /dev/null \
            "$MO"


      # ============================================================
      # 9. Add Japanese MO to the prepared web_bundle
      # ============================================================

      - name: Add Japanese localization to web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          SRC="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"
          DST="web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$SRC"

          mkdir -p "$(dirname "$DST")"

          cp "$SRC" "$DST"

          echo "=========================================="
          echo "Japanese localization added"
          echo "=========================================="

          ls -lh "$DST"

          echo
          echo "SHA256:"
          sha256sum "$DST"


      # ============================================================
      # 10. Repack ONLY the data
      #
      # This is the critical step.
      #
      # Existing cataclysm-tiles.js
      # Existing cataclysm-tiles.wasm
      #
      # are NOT touched.
      # ============================================================

      - name: Repack data with Japanese localization
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          echo "=========================================="
          echo "Repacking data"
          echo "=========================================="

          rm -f \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            cataclysm-tiles.data \
            --js-output=cataclysm-tiles.data.js \
            --no-node \
            --preload "web_bundle@/" \
            --lz4

          echo
          echo "=== Repacked files ==="

          ls -lh \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js


      # ============================================================
      # 11. Verify Japanese localization is inside generated package
      # ============================================================

      - name: Verify Japanese localization
        working-directory: cdda
        run: |
          set -euo pipefail

          MO_PATH="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          echo "=========================================="
          echo "Verifying Japanese localization"
          echo "=========================================="

          test -f "$MO_PATH"

          echo
          echo "Searching generated data loader..."

          if ! grep -q \
            "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            cataclysm-tiles.data.js; then

            echo
            echo "ERROR:"
            echo "Japanese MO was NOT found in cataclysm-tiles.data.js."

            exit 1
          fi

          echo
          echo "SUCCESS:"
          echo "Japanese MO is included in the generated package."


      # ============================================================
      # 12. Replace ONLY .data and .data.js
      #
      # Existing JS / WASM remain untouched.
      # ============================================================

      - name: Replace data files in site
        run: |
          set -euo pipefail

          cp \
            cdda/cataclysm-tiles.data \
            site/cataclysm-tiles.data

          cp \
            cdda/cataclysm-tiles.data.js \
            site/cataclysm-tiles.data.js

          echo "=========================================="
          echo "Updated site files"
          echo "=========================================="

          ls -lh \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js


      # ============================================================
      # 13. Verify JS/WASM were not replaced
      # ============================================================

      - name: Verify WASM remains unchanged
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Final WASM verification"
          echo "=========================================="

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm

          echo
          echo "cataclysm-tiles.js:"
          ls -lh site/cataclysm-tiles.js

          echo
          echo "cataclysm-tiles.wasm:"
          ls -lh site/cataclysm-tiles.wasm

          echo
          echo "No WASM compilation was performed."


      # ============================================================
      # 14. Cache bust
      #
      # Prevent the browser from continuing to use the old
      # cataclysm-tiles.data.js.
      # ============================================================

      - name: Add cache bust to data loader
        run: |
          set -euo pipefail

          VERSION="$(sha256sum site/cataclysm-tiles.data.js | cut -c1-16)"

          echo "Cache version: $VERSION"

          python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]

          path = pathlib.Path("site/index.html")

          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'cataclysm-tiles\.data\.js(?:\?[^"\']*)?',
              f'cataclysm-tiles.data.js?v={version}',
              text
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(f"Updated data loader cache version: {version}")
          PY

          echo
          grep -n "cataclysm-tiles.data.js" site/index.html || true


      # ============================================================
      # 15. Final site verification
      # ============================================================

      - name: Final verification
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          REQUIRED_FILES=(
            "site/cataclysm-tiles.js"
            "site/cataclysm-tiles.wasm"
            "site/cataclysm-tiles.data"
            "site/cataclysm-tiles.data.js"
            "site/index.html"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            test -f "$FILE"
            echo "OK: $FILE"
          done

          echo
          echo "=== Final checksums ==="

          sha256sum \
            site/cataclysm-tiles.js \
            site/cataclysm-tiles.wasm \
            site/cataclysm-tiles.data \
            site/cataclysm-tiles.data.js

          echo
          echo "=========================================="
          echo "JAPANESE REPACK COMPLETE"
          echo "=========================================="
          echo
          echo "WASM: reused"
          echo "JavaScript: reused"
          echo "Data: rebuilt with Japanese localization"
          echo "Pages: ready for deployment"


      # ============================================================
      # 16. Upload artifact
      # ============================================================

      - name: Upload Japanese web bundle
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-ja
          path: site/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 17. Upload GitHub Pages artifact
      # ============================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/


  # ================================================================
  # Deploy
  # ================================================================

  deploy:
    name: Deploy Japanese Web Build

    needs: repack

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
