name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51
          actions-cache-folder: emsdk-cache-3.1.51

      - name: Install ccache for emscripten
        run: |
          emsdk install ccache-git-emscripten-64bit
          emsdk activate ccache-git-emscripten-64bit

      - name: Get ccache path
        id: ccache-vars
        run: |
          echo "datetime=$(/bin/date -u '+%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "path=$HOME/.cache/ccache" >> $GITHUB_OUTPUT

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ steps.ccache-vars.outputs.path }}
          key: ccache-cdda-0I-emscripten-${{ steps.ccache-vars.outputs.datetime }}
          restore-keys: |
            ccache-cdda-0I-emscripten-

      - name: Build cataclysm-tiles.js (wasm)
        working-directory: cdda
        run: |
          emsdk activate ccache-git-emscripten-64bit
          export PATH="${PATH%%:*}/../../ccache/git-emscripten_64bit/bin":$PATH
          export EM_CONFIG=$EMSDK/.emscripten
          export CCACHE_COMPILERCHECK=string:3.1.51
          ccache -M 15G
          ccache --zero-stats
          make -j$(nproc) \
            NATIVE=emscripten BACKTRACE=0 TILES=1 TESTS=0 RUNTESTS=0 \
            RELEASE=1 CCACHE=1 LINTJSON=0 cataclysm-tiles.js
          ccache --show-stats

      - name: Prepare web bundle (data + LZ4 pack)
        working-directory: cdda
        run: bash build-scripts/prepare-web.sh

      - name: Copy profile-aware shell over upstream shell
        run: cp shell/index.html cdda/build/index.html

      - name: Stage site
        run: |
          mkdir -p site
          cp -v cdda/build/* site/
          ls -lh site/

      - name: Upload artifact (raw)
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
