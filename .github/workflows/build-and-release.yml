name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm bundle
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift || true
          df -h /

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Relax link-time optimization (-Os -> -O1, link only)
        working-directory: cdda
        run: |
          sed -i 's/^\s*LDFLAGS\s*+=\s*-Os\s*$/    LDFLAGS += -O1/' Makefile
          grep -n "LDFLAGS += -O1" Makefile

      # ==========================================================
      # Japanese localization
      # ==========================================================

      - name: Build Japanese localization
        working-directory: cdda
        run: |
          echo "=== Checking localization files ==="

          find lang -maxdepth 3 -type f | sort | head -200

          echo
          echo "=== Japanese localization candidates ==="

          find lang -type f \
            \( -iname '*ja*' -o -iname '*japanese*' \) \
            -print

          echo
          echo "=== Makefile localization settings ==="

          grep -nE 'LOCALIZE|LANGUAGES|compile_mo|localization' Makefile || true

          echo
          echo "=== Building Japanese localization ==="

          if [ -f "lang/compile_mo.sh" ]; then
            chmod +x lang/compile_mo.sh
            bash lang/compile_mo.sh ja
          else
            echo "lang/compile_mo.sh was not found."
            echo "Using Makefile localization build."

            make LOCALIZE=1 LANGUAGES="ja" localization
          fi

          echo
          echo "=== Generated localization files ==="

          find lang -type f \
            \( -path '*/mo/*' -o -iname '*ja*' \) \
            -print

      # ==========================================================
      # WebAssembly build
      # ==========================================================

      - name: Build cataclysm-tiles.js (wasm)
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"
        run: |
          source $EMSDK/emsdk_env.sh

          df -h /
          free -h

          time make -j2 \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            CCACHE=0 \
            LINTJSON=0 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            cataclysm-tiles.js

          echo
          echo "=== WASM output ==="

          ls -lh cataclysm-tiles.js
          ls -lh cataclysm-tiles.wasm

      # ==========================================================
      # Prepare web bundle
      # ==========================================================

      - name: Prepare web bundle (data + LZ4 pack)
        working-directory: cdda
        run: |
          source $EMSDK/emsdk_env.sh
          bash build-scripts/prepare-web.sh

      # ==========================================================
      # Japanese localization verification
      # ==========================================================

      - name: Verify Japanese localization in web bundle
        working-directory: cdda
        run: |
          echo "=== Searching build output for Japanese localization ==="

          find build -type f \
            \( -iname '*ja*' -o -path '*/mo/*' \) \
            -print

          echo
          echo "=== Build directory ==="

          ls -lah build/

      # ==========================================================
      # Font
      # ==========================================================

      - name: Copy profile-aware shell
        run: |
          cp shell/index.html cdda/build/index.html

      # ==========================================================
      # Stage site
      # ==========================================================

      - name: Stage site
        run: |
          mkdir -p site
          cp -v cdda/build/* site/

          echo
          echo "=== Final site ==="

          find site -maxdepth 2 -type f | sort
          echo
          ls -lh site/

      # ==========================================================
      # Artifacts
      # ==========================================================

      - name: Upload artifact (raw)
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
