      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COMPILE JAPANESE TRANSLATION"
          echo "=========================================="

          PO="lang/po/ja.po"
          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -f "$PO"

          echo "PO file:"
          ls -lh "$PO"

          mkdir -p "$(dirname "$MO")"

          msgfmt \
            --check \
            --check-accelerators=_ \
            -o "$MO" \
            "$PO"

          test -s "$MO"

          echo
          echo "Japanese MO successfully created:"
          ls -lh "$MO"

          echo
          echo "SHA256:"
          sha256sum "$MO"

          echo
          echo "Translation statistics:"

          msgfmt \
            --statistics \
            -o /dev/null \
            "$PO"
