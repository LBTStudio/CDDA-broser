name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Japanese-enabled WASM bundle
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      # ==========================================================
      # Checkout wrapper repository
      # ==========================================================
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      # ==========================================================
      # Checkout CDDA 0.I
      # ==========================================================
      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      # ==========================================================
      # Dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            jq \
            gettext

          echo "gettext:"
          msgfmt --version | head -1

      # ==========================================================
      # Free disk space
      # ==========================================================
      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          echo "=== Disk space ==="
          df -h /

      # ==========================================================
      # Emscripten
      # ==========================================================
      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      # ==========================================================
      # Reduce final linker optimization
      #
      # This is retained because the previous successful build
      # used this workaround to avoid the extremely long -Os
      # final wasm-opt/link stage.
      # ==========================================================
      - name: Relax link-time optimization
        working-directory: cdda
        run: |
          set -euo pipefail

          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O1/' \
            Makefile

          echo "=== Linker flags ==="
          grep -n "LDFLAGS" Makefile | head -20

      # ==========================================================
      # Verify Japanese source
      # ==========================================================
      - name: Verify Japanese translation source
        working-directory: cdda
        run: |
          set -euo pipefail

          echo "=== Japanese translation source ==="

          test -f lang/po/ja.po

          ls -lh lang/po/ja.po

      # ==========================================================
      # Build Japanese MO before the main build
      #
      # Do not rely on compile_mo.sh.
      # Generate the MO directly with gettext.
      # ==========================================================
      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          echo "=== Compile Japanese translation ==="

          PO="lang/po/ja.po"
          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          mkdir -p "$(dirname "$MO")"

          msgfmt \
            -f \
            -o "$MO" \
            "$PO"

          test -s "$MO"

          echo
          echo "=== Japanese MO ==="

          ls -lh "$MO"

          echo
          echo "=== SHA256 ==="

          sha256sum "$MO"

      # ==========================================================
      # Build WASM
      # ==========================================================
      - name: Build cataclysm-tiles.js
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          echo "=========================================="
          echo "BUILD CDDA 0.I"
          echo "=========================================="

          echo
          echo "=== Disk ==="
          df -h /

          echo
          echo "=== Memory ==="
          free -h

          echo
          echo "=== Localization ==="
          echo "LOCALIZE=1"
          echo "LANGUAGES=ja"

          echo
          echo "=== Starting build ==="

          time make -j"$(nproc)" \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            CCACHE=0 \
            LINTJSON=0 \
            cataclysm-tiles.js

          echo
          echo "=== WASM output ==="

          test -s cataclysm-tiles.js
          test -s cataclysm-tiles.wasm

          ls -lh \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm

      # ==========================================================
      # Prepare normal web bundle
      # ==========================================================
      - name: Prepare web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          bash build-scripts/prepare-web.sh

      # ==========================================================
      # Add Japanese MO to the web bundle
      #
      # This does NOT rebuild the WASM.
      # ==========================================================
      - name: Add Japanese locale to web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -s "$MO"

          mkdir -p \
            build/lang/mo/ja/LC_MESSAGES

          cp \
            "$MO" \
            build/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo "=== Japanese locale installed ==="

          ls -lh \
            build/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      # ==========================================================
      # Copy custom shell
      # ==========================================================
      - name: Copy profile-aware shell
        run: |
          set -euo pipefail

          test -f shell/index.html
          test -d cdda/build

          cp \
            shell/index.html \
            cdda/build/index.html

      # ==========================================================
      # Stage site
      # ==========================================================
      - name: Stage site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp -a \
            cdda/build/. \
            site/

          echo "=== Final site contents ==="

          find site \
            -maxdepth 5 \
            -type f \
            -print \
            | sort

          echo
          echo "=== Site size ==="

          du -sh site/

      # ==========================================================
      # Minimal verification
      #
      # IMPORTANT:
      # Do NOT inspect the internal representation of the
      # Emscripten .data.js file.
      #
      # Only verify files that must physically exist.
      # ==========================================================
      - name: Verify final site
        run: |
          set -euo pipefail

          echo "=== Required files ==="

          REQUIRED_FILES=(
            "site/cataclysm-tiles.js"
            "site/cataclysm-tiles.wasm"
            "site/cataclysm-tiles.data"
            "site/cataclysm-tiles.data.js"
            "site/index.html"
            "site/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: Missing or empty file:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo
          echo "=== Final verification completed ==="

      # ==========================================================
      # Upload artifact
      #
      # This is deliberately after only the minimal verification.
      # No expensive operation follows this point.
      # ==========================================================
      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # Upload GitHub Pages artifact
      # ==========================================================
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ==============================================================
  # Deploy
  # ==============================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
