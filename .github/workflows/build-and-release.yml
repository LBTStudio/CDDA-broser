name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build CDDA 0.I WebAssembly - Japanese
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:

      # ==========================================================
      # 1. Checkout wrapper repository
      # ==========================================================
      - name: Checkout wrapper repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Checkout CDDA 0.I
      # ==========================================================
      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1


      # ==========================================================
      # 3. Install dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            jq \
            gettext

          echo "=== gettext ==="
          msgfmt --version | head -1

          echo
          echo "=== jq ==="
          jq --version


      # ==========================================================
      # 4. Free disk space
      # ==========================================================
      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          echo "=== Disk space ==="
          df -h /


      # ==========================================================
      # 5. Setup Emscripten
      # ==========================================================
      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51


      # ==========================================================
      # 6. Relax final linker optimization
      #
      # Retained from the previously successful build workaround.
      # ==========================================================
      - name: Relax link-time optimization
        working-directory: cdda
        run: |
          set -euo pipefail

          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O1/' \
            Makefile

          echo "=== LDFLAGS ==="
          grep -n "LDFLAGS" Makefile | head -20


      # ==========================================================
      # 7. Verify Japanese source
      # ==========================================================
      - name: Verify Japanese translation source
        working-directory: cdda
        run: |
          set -euo pipefail

          test -f lang/po/ja.po

          echo "=== Japanese PO ==="
          ls -lh lang/po/ja.po


      # ==========================================================
      # 8. Compile Japanese PO -> MO
      # ==========================================================
      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          PO="lang/po/ja.po"
          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          mkdir -p "$(dirname "$MO")"

          msgfmt \
            -f \
            -o "$MO" \
            "$PO"

          test -s "$MO"

          echo "=== Japanese MO ==="
          ls -lh "$MO"

          sha256sum "$MO"


      # ==========================================================
      # 9. Build WASM
      #
      # LOCALIZE=1 keeps CDDA localization support enabled.
      # LANGUAGES=ja ensures Japanese translation is built.
      # ==========================================================
      - name: Build cataclysm-tiles.js
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          echo "=========================================="
          echo "BUILD CDDA 0.I"
          echo "=========================================="

          df -h /
          free -h

          echo
          echo "=== Build settings ==="
          echo "LOCALIZE=1"
          echo "LANGUAGES=ja"

          time make -j"$(nproc)" \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            CCACHE=0 \
            LINTJSON=0 \
            cataclysm-tiles.js

          echo
          echo "=== WASM output ==="

          test -s cataclysm-tiles.js
          test -s cataclysm-tiles.wasm

          ls -lh \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm


      # ==========================================================
      # 10. Build web_bundle manually
      #
      # We intentionally do not call prepare-web.sh.
      # The official script performs the same broad operation,
      # but we need lang/mo/ja inside the bundle BEFORE packaging.
      # ==========================================================
      - name: Create web bundle with Japanese locale
        working-directory: cdda
        run: |
          set -euo pipefail

          rm -rf web_bundle
          mkdir -p web_bundle/data

          echo "=== Copy game data ==="

          cp -R \
            data/core \
            data/font \
            data/fontdata.json \
            data/json \
            data/mods \
            data/names \
            data/raw \
            data/motd \
            data/credits \
            data/title \
            web_bundle/data/

          echo
          echo "=== Copy graphics ==="

          cp -R gfx web_bundle/


          echo
          echo "=== Remove .DS_Store ==="

          find web_bundle \
            -name ".DS_Store" \
            -type f \
            -delete


          echo
          echo "=== Remove obsolete mods ==="

          shopt -s nullglob

          for MOD_DIR in web_bundle/data/mods/*/; do
            if [ -f "$MOD_DIR/modinfo.json" ]; then
              if jq -e \
                '.[] | select(.type == "MOD_INFO") | .obsolete' \
                "$MOD_DIR/modinfo.json" \
                >/dev/null
              then
                echo "Removing obsolete mod: $MOD_DIR"
                rm -rf "$MOD_DIR"
              fi
            fi
          done


          echo
          echo "=== Remove MA mod ==="

          rm -rf web_bundle/data/mods/MA


          echo
          echo "=== Remove Ultica_iso tileset ==="

          rm -rf web_bundle/gfx/Ultica_iso


          echo
          echo "=== Add Japanese locale ==="

          MO_SRC="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"
          MO_DST="web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -s "$MO_SRC"

          mkdir -p "$(dirname "$MO_DST")"

          cp \
            "$MO_SRC" \
            "$MO_DST"

          test -s "$MO_DST"

          echo "Japanese locale:"
          ls -lh "$MO_DST"

          echo
          echo "=== Bundle size ==="

          du -sh web_bundle


      # ==========================================================
      # 11. Package web_bundle into Emscripten virtual filesystem
      #
      # This does not rebuild C++ or WASM.
      # ==========================================================
      - name: Package web data
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          rm -f \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            cataclysm-tiles.data \
            --js-output=cataclysm-tiles.data.js \
            --no-node \
            --preload "web_bundle@/" \
            --lz4

          test -s cataclysm-tiles.data
          test -s cataclysm-tiles.data.js

          echo "=== Packaged web data ==="

          ls -lh \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js


      # ==========================================================
      # 12. Assemble CDDA build directory
      #
      # Equivalent to the final copy stage of prepare-web.sh.
      # ==========================================================
      - name: Assemble web build
        working-directory: cdda
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          cp \
            build-data/web/index.html \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm \
            data/font/Terminus.ttf \
            build/

          cp \
            data/cataicon.ico \
            build/favicon.ico

          echo "=== CDDA build files ==="

          find build \
            -maxdepth 2 \
            -type f \
            -printf "%p %s bytes\n" \
            | sort


      # ==========================================================
      # 13. Copy custom shell
      # ==========================================================
      - name: Copy custom shell
        run: |
          set -euo pipefail

          test -f shell/index.html
          test -d cdda/build

          cp \
            shell/index.html \
            cdda/build/index.html


      # ==========================================================
      # 14. Stage final GitHub Pages site
      # ==========================================================
      - name: Stage site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp -a \
            cdda/build/. \
            site/

          echo "=== Final site ==="

          find site \
            -maxdepth 3 \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

          echo
          du -sh site/


      # ==========================================================
      # 15. Minimal verification
      #
      # Only check actual required output files.
      # Do not inspect internal .data.js representation.
      # ==========================================================
      - name: Verify final site
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "site/cataclysm-tiles.js"
            "site/cataclysm-tiles.wasm"
            "site/cataclysm-tiles.data"
            "site/cataclysm-tiles.data.js"
            "site/index.html"
            "site/Terminus.ttf"
            "site/favicon.ico"
          )

          echo "=== Required files ==="

          for FILE in "${REQUIRED_FILES[@]}"; do
            test -s "$FILE"
            echo "OK: $FILE"
          done

          echo
          echo "=== Japanese source used for package ==="

          test -s \
            cdda/web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          ls -lh \
            cdda/web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo
          echo "Verification completed."


      # ==========================================================
      # 16. Save raw artifact first
      #
      # If Pages deployment fails later, the expensive build output
      # is still preserved.
      # ==========================================================
      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-japanese
          path: site/
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 17. Upload Pages artifact
      # ==========================================================
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/


  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
