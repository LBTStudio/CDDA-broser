name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm bundle
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Relax link-time optimization
        working-directory: cdda
        run: |
          set -euo pipefail

          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O1/' \
            Makefile

          echo "=== Effective linker flags ==="
          grep -n "LDFLAGS" Makefile | head -20

      - name: Build cataclysm-tiles.js
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          echo "=== Disk ==="
          df -h /

          echo
          echo "=== Memory ==="
          free -h

          echo
          echo "=== Building CDDA 0.I WebAssembly ==="

          time make -j"$(nproc)" \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            CCACHE=0 \
            LINTJSON=0 \
            cataclysm-tiles.js

          echo
          echo "=== WASM output ==="

          test -f cataclysm-tiles.js
          test -f cataclysm-tiles.wasm

          ls -lh \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm

      - name: Prepare web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          bash build-scripts/prepare-web.sh

      - name: Copy profile-aware shell
        run: |
          set -euo pipefail

          test -f shell/index.html
          test -f cdda/build/index.html

          cp shell/index.html cdda/build/index.html

      - name: Stage site
        run: |
          set -euo pipefail

          mkdir -p site

          cp -a cdda/build/. site/

          echo "=== Final site contents ==="
          find site -maxdepth 3 -type f | sort

          echo
          echo "=== Site size ==="
          du -sh site/

      - name: Verify required files
        run: |
          set -euo pipefail

          test -f site/cataclysm-tiles.js
          test -f site/cataclysm-tiles.wasm
          test -f site/cataclysm-tiles.data
          test -f site/cataclysm-tiles.data.js
          test -f site/index.html

          echo "All required files are present."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
