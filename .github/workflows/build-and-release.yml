name: QA build — full staged CDDA 0.I artifact

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy the verified artifact to GitHub Pages'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-full-staged-artifact:
    name: Build full staged Asyncify artifact
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4

      - name: Checkout fixed CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 27939e29b8b4ddc081490d9f51de59a459c88df6
          path: cdda
          fetch-depth: 1

      - name: Confirm fixed source and QA inputs
        run: |
          set -euo pipefail
          test "$(git -C cdda rev-parse HEAD)" = "27939e29b8b4ddc081490d9f51de59a459c88df6"
          test -s patches/cdda-0I-emscripten-mo-reader.patch
          test -s patches/cdda-0I-emscripten-mod-finalize-yield.patch
          test -s patches/cdda-0I-emscripten-world-yield.patch
          test -s qa/true-phase-runtime/cdda-0I-emscripten-staged-phase-loader.patch
          test -s qa/true-phase-runtime/staged-package-manifest.json

      - name: Install localization dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext

      # This historical toolchain/link arrangement completed prior full Asyncify
      # builds. It is QA-only; target browser-runtime acceptance remains separate.
      - name: Set up Emscripten 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Use stable final-link mode
        working-directory: cdda
        run: |
          set -euo pipefail
          # Keep release C++ compilation and all data intact. This replaces only
          # the final post-Asyncify size optimizer setting in the temporary build tree.
          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O0/' \
            Makefile
          sed -i \
            's/-sSTACK_SIZE=262144/-sSTACK_SIZE=1048576/' \
            Makefile
          sed -i \
            's/-sASYNCIFY_STACK_SIZE=16384/-sASYNCIFY_STACK_SIZE=4194304/' \
            Makefile
          grep -n -E 'LDFLAGS \+= -O0|LDFLAGS \+= -sASYNCIFY|STACK_SIZE|MAXIMUM_MEMORY' Makefile

      - name: Apply source-level Japanese and phase patches
        working-directory: cdda
        run: |
          set -euo pipefail
          git apply --check ../patches/cdda-0I-emscripten-mo-reader.patch
          git apply ../patches/cdda-0I-emscripten-mo-reader.patch
          git apply --check ../qa/true-phase-runtime/cdda-0I-emscripten-staged-phase-loader.patch
          git apply ../qa/true-phase-runtime/cdda-0I-emscripten-staged-phase-loader.patch
          git apply --check ../patches/cdda-0I-emscripten-mod-finalize-yield.patch
          git apply ../patches/cdda-0I-emscripten-mod-finalize-yield.patch
          git apply --check ../patches/cdda-0I-emscripten-world-yield.patch
          git apply ../patches/cdda-0I-emscripten-world-yield.patch
          git diff --check
          grep -q 'staged_ensure_world_groups' src/game.cpp
          grep -q 'ensure_staged_tileset_assets' src/sdltiles.cpp
          grep -q 'mmap_file' src/mmap_file.cpp
          grep -q '#include <emscripten.h>' src/init.cpp
          grep -q 'emscripten_sleep' src/init.cpp
          grep -q 'emscripten_sleep' src/overmap.cpp

      - name: Build Asyncify WebAssembly
        working-directory: cdda
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          # Keep the genuine Binaryen directory untouched.  Emscripten resolves
          # executables through EM_BINARYEN_ROOT, so use a symlink overlay that
          # substitutes only wasm-opt with a transparent, stderr-only heartbeat
          # wrapper.  All Binaryen arguments, stdout, and exit codes are kept.
          real_binaryen_root="${EM_BINARYEN_ROOT:-$EMSDK/upstream}"
          monitor_binaryen_root="$RUNNER_TEMP/cdda-binaryen-monitor"
          rm -rf "$monitor_binaryen_root"
          mkdir -p "$monitor_binaryen_root/bin"
          for tool in "$real_binaryen_root/bin/"*; do
            ln -s "$tool" "$monitor_binaryen_root/bin/$(basename "$tool")"
          done
          rm "$monitor_binaryen_root/bin/wasm-opt"
          install -m 0755 ../qa/true-phase-runtime/wasm-opt-progress-wrapper.sh \
            "$monitor_binaryen_root/bin/wasm-opt"
          export EM_BINARYEN_ROOT="$monitor_binaryen_root"
          export CDDA_REAL_WASM_OPT="$real_binaryen_root/bin/wasm-opt"
          printf '::notice title=Build stage::C++ compile and final emcc link started; every wasm-opt invocation will emit a 60-second heartbeat.\\n'
          make -j4 \
            NATIVE=emscripten BACKTRACE=0 TILES=1 TESTS=0 RUNTESTS=0 RELEASE=1 \
            LOCALIZE=1 LANGUAGES=ja CCACHE=0 LINTJSON=0 \
            WARNINGS='-Werror -Wall -Wextra -Wformat-signedness -Wlogical-op -Wmissing-declarations -Wmissing-noreturn -Wpedantic -Wunused-macros -Wno-gnu-zero-variadic-macro-arguments -Wno-error=c++20-extensions' \
            cataclysm-tiles.js
          test -s cataclysm-tiles.js
          test -s cataclysm-tiles.wasm
          printf '::notice title=Build stage::C++ compile, final emcc link, and wasm-opt processing completed.\\n'

      - name: Build Japanese MO catalog
        working-directory: cdda
        run: |
          set -euo pipefail
          make localization LANGUAGES=ja
          test -s lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Generate complete staged LZ4 payload
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          rm -rf site
          mkdir -p site
          cp cdda/cataclysm-tiles.js cdda/cataclysm-tiles.wasm site/
          cp qa/true-phase-runtime/index-staged.html site/index.html
          cp qa/true-phase-runtime/staged-lz4-loader-yield.js site/
          cp qa/true-phase-runtime/staged-phase-runtime.js site/
          cp qa/true-phase-runtime/verify_staged_artifact.py site/
          python3 qa/true-phase-runtime/generate_staged_lz4_packages.py \
            --source-root cdda \
            --manifest qa/true-phase-runtime/staged-package-manifest.json \
            --out site/payload \
            --file-packager "$EMSDK/upstream/emscripten/tools/file_packager"
          cp site/payload/staged-package-manifest.json site/
          cp site/payload/*.data site/
          cp site/payload/*.data.js site/
          rm -rf site/payload

      - name: Verify full payload and true-phase artifact
        run: |
          set -euo pipefail
          python3 qa/true-phase-runtime/verify_staged_artifact.py \
            --manifest site/staged-package-manifest.json --payload-dir site
          test -s site/cataclysm-tiles.js
          test -s site/cataclysm-tiles.wasm
          test -s site/boot-audio.data
          test -s site/boot-localization.data
          test -s site/world-core-json.data
          test -s site/world-mod-MA.data
          test -s site/world-gfx-Ultica_iso-assets.data
          grep -q 'staged_ensure_world_groups' site/cataclysm-tiles.js
          grep -q 'CDDA_STAGED_BOOT_GROUPS' site/index.html
          grep -q 'existing profile settings preserved' site/index.html
          ! grep -q 'languageOption.value === "en"' site/index.html
          du -sh site

      - name: Upload local-QA artifact only
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-full-true-phase-asyncify
          path: site/
          if-no-files-found: error
          retention-days: 14

      - name: Upload QA site to GitHub Pages
        if: ${{ inputs.deploy_pages != false }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-pages:
    name: Publish QA site on GitHub Pages
    if: ${{ inputs.deploy_pages != false }}
    needs: build-full-staged-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy QA site
        id: deployment
        uses: actions/deploy-pages@v4
