name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build CDDA 0.I WebAssembly - Japanese
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq gettext
          msgfmt --version | head -1

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Relax link-time optimization
        working-directory: cdda
        run: |
          set -euo pipefail

          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O1/' \
            Makefile

          grep -n "LDFLAGS" Makefile | head -20

      - name: Build cataclysm-tiles.js with Japanese localization
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          echo "=== Build configuration ==="
          echo "LOCALIZE=1"
          echo "LANGUAGES=ja"

          df -h /
          free -h

          time make -j"$(nproc)" \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            CCACHE=0 \
            LINTJSON=0 \
            cataclysm-tiles.js

          echo "=== Verify WASM output ==="

          test -s cataclysm-tiles.js
          test -s cataclysm-tiles.wasm

          ls -lh \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm

      - name: Verify Japanese MO produced by make
        working-directory: cdda
        run: |
          set -euo pipefail

          test -f lang/po/ja.po

          test -s \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo "Japanese MO successfully produced by CDDA build."

          ls -lh \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Patch official web preparation for Japanese locale
        working-directory: cdda
        run: |
          set -euo pipefail

          cp \
            build-scripts/prepare-web.sh \
            build-scripts/prepare-web-ja.sh

          python3 <<'PY'
          from pathlib import Path

          path = Path("build-scripts/prepare-web-ja.sh")
          text = path.read_text(encoding="utf-8")

          marker = "file_packager"

          if marker not in text:
              raise SystemExit(
                  "ERROR: file_packager was not found in prepare-web.sh"
              )

          insertion = r'''
echo "Adding Japanese translation to web bundle..."

mkdir -p \
  "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES"

cp \
  "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
  "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

test -s \
  "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

'''

          lines = text.splitlines(keepends=True)

          index = None

          for i, line in enumerate(lines):
              if "file_packager" in line:
                  index = i
                  break

          if index is None:
              raise SystemExit(
                  "ERROR: could not locate file_packager command"
              )

          lines.insert(index, insertion)

          path.write_text(
              "".join(lines),
              encoding="utf-8"
          )
          PY

          echo "=== Japanese locale patch ==="

          grep -n \
            -A12 \
            -B3 \
            "Adding Japanese translation" \
            build-scripts/prepare-web-ja.sh

      - name: Prepare official web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          bash build-scripts/prepare-web-ja.sh

          echo "=== Verify source web bundle ==="

          test -s \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          ls -lh \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Verify packaged output
        working-directory: cdda
        run: |
          set -euo pipefail

          REQUIRED=(
            build/cataclysm-tiles.js
            build/cataclysm-tiles.wasm
            build/cataclysm-tiles.data
            build/cataclysm-tiles.data.js
          )

          for FILE in "${REQUIRED[@]}"; do
            test -s "$FILE"
            echo "OK: $FILE"
          done

          echo "Official web bundle completed successfully."

      - name: Copy custom shell
        run: |
          set -euo pipefail

          test -f shell/index.html

          cp \
            shell/index.html \
            cdda/build/index.html

      - name: Stage site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp -a \
            cdda/build/. \
            site/

          echo "=== Final site ==="

          find site \
            -maxdepth 2 \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

          du -sh site/

      - name: Final verification
        run: |
          set -euo pipefail

          REQUIRED=(
            site/index.html
            site/cataclysm-tiles.js
            site/cataclysm-tiles.wasm
            site/cataclysm-tiles.data
            site/cataclysm-tiles.data.js
            site/Terminus.ttf
            site/favicon.ico
          )

          for FILE in "${REQUIRED[@]}"; do
            test -s "$FILE"
            echo "OK: $FILE"
          done

          echo "Final site verification passed."

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-japanese
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
