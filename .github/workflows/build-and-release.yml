name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm bundle
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Free disk space
        # Remove ~30GB of preinstalled toolchains we never use.
        # This prevents "no space left on device" during the wasm link.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift || true
          df -h /

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Relax link-time optimization (-Os -> -O1, link only)
        # The -Os link makes wasm-opt chew on a ~50MB module for a very long
        # time. Compile stays -Os; only the final link optimization is relaxed.
        working-directory: cdda
        run: |
          sed -i 's/^\s*LDFLAGS\s*+=\s*-Os\s*$/    LDFLAGS += -O1/' Makefile
          grep -n "LDFLAGS += -O1" Makefile

      - name: Build cataclysm-tiles.js (wasm)
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"   # stream stage-by-stage progress so the log never looks frozen
        run: |
          source $EMSDK/emsdk_env.sh
          df -h /
          free -h
          time make -j$(nproc) \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            CCACHE=0 \
            LINTJSON=0 \
            cataclysm-tiles.js
          ls -lh cataclysm-tiles.js cataclysm-tiles.wasm

      - name: Prepare web bundle (data + LZ4 pack)
        working-directory: cdda
        run: |
          source $EMSDK/emsdk_env.sh
          bash build-scripts/prepare-web.sh

      - name: Copy profile-aware shell
        run: cp shell/index.html cdda/build/index.html

      - name: Stage site
        run: |
          mkdir -p site
          cp -v cdda/build/* site/
          ls -lh site/

      - name: Upload artifact (raw)
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
