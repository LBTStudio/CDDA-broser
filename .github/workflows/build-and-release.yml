name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build CDDA 0.I WebAssembly - Japanese default
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq gettext

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Relax link-time optimization
        working-directory: cdda
        run: |
          set -euo pipefail

          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O1/' \
            Makefile

          grep -n "LDFLAGS" Makefile | head -20

      - name: Set Japanese as default language
        working-directory: cdda
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/options.cpp")
          text = path.read_text(encoding="utf-8")

          old = 'options_manager::get_lang_options(), "" );'
          new = 'options_manager::get_lang_options(), "ja" );'

          if old not in text:
              raise SystemExit(
                  "ERROR: USE_LANG default pattern was not found"
              )

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          grep -n \
            -A4 \
            -B2 \
            'add( "USE_LANG"' \
            src/options.cpp

          grep -q \
            'options_manager::get_lang_options(), "ja" );' \
            src/options.cpp

      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          test -f lang/po/ja.po

          bash lang/compile_mo.sh ja

          test -s \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          ls -lh \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Build cataclysm-tiles.js
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          df -h /
          free -h

          time make -j"$(nproc)" \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            CCACHE=0 \
            LINTJSON=0 \
            cataclysm-tiles.js

          test -s cataclysm-tiles.js
          test -s cataclysm-tiles.wasm

          ls -lh \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm

      - name: Prepare official web bundle with Japanese locale
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          test -s \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          cp \
            build-scripts/prepare-web.sh \
            build-scripts/prepare-web-ja.sh

          python3 <<'PY'
          from pathlib import Path

          path = Path("build-scripts/prepare-web-ja.sh")
          text = path.read_text(encoding="utf-8")

          needle = (
              '$EMSDK/upstream/emscripten/tools/file_packager '
              'cataclysm-tiles.data '
          )

          insert = (
              'mkdir -p "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES"\n'
              'cp lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo '
              '"$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES/"\n'
              'test -s '
              '"$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"\n\n'
          )

          count = text.count(needle)

          if count != 1:
              raise SystemExit(
                  f"ERROR: expected one file_packager command, found {count}"
              )

          text = text.replace(
              needle,
              insert + needle,
              1
          )

          path.write_text(text, encoding="utf-8")
          PY

          echo "=== Patched prepare script ==="

          grep -n \
            -A6 \
            -B3 \
            'lang/mo/ja' \
            build-scripts/prepare-web-ja.sh

          echo "=== Running official prepare flow ==="

          bash build-scripts/prepare-web-ja.sh

          echo "=== Web bundle completed ==="

          test -s \
            build/cataclysm-tiles.data

          test -s \
            build/cataclysm-tiles.data.js

          test -s \
            build/cataclysm-tiles.js

          test -s \
            build/cataclysm-tiles.wasm

      - name: Verify Japanese locale was bundled
        working-directory: cdda
        run: |
          set -euo pipefail

          test -s \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          ls -lh \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          echo "Japanese locale exists before file packaging."

      - name: Copy custom shell
        run: |
          set -euo pipefail

          test -f shell/index.html
          test -d cdda/build

          cp \
            shell/index.html \
            cdda/build/index.html

      - name: Stage site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp -a \
            cdda/build/. \
            site/

          find site \
            -maxdepth 2 \
            -type f \
            | sort

          du -sh site/

      - name: Verify final site
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "site/cataclysm-tiles.js"
            "site/cataclysm-tiles.wasm"
            "site/cataclysm-tiles.data"
            "site/cataclysm-tiles.data.js"
            "site/index.html"
            "site/Terminus.ttf"
            "site/favicon.ico"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            test -s "$FILE"
            echo "OK: $FILE"
          done

          test -s \
            cdda/web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          grep -q \
            'options_manager::get_lang_options(), "ja" );' \
            cdda/src/options.cpp

          echo "Final verification passed."

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-japanese
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
