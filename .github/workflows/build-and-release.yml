name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同じPages公開用Workflowを同時に走らせない。
# 新しいRunを開始した場合、古いRunをキャンセルする。
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build CDDA 0.I WebAssembly - Japanese default
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:

      # ==========================================================
      # 1. Checkout wrapper repository
      # ==========================================================

      - name: Checkout wrapper repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Checkout exact CDDA 0.I source
      # ==========================================================

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1


      # ==========================================================
      # 3. Install dependencies
      # ==========================================================

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            jq \
            gettext

          echo "=== gettext ==="
          msgfmt --version | head -1


      # ==========================================================
      # 4. Free disk space
      # ==========================================================

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          echo "=== Disk space ==="
          df -h /


      # ==========================================================
      # 5. Setup Emscripten
      # ==========================================================

      - name: Setup emsdk 3.1.51
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51


      # ==========================================================
      # 6. Relax final link optimization
      #
      # This workaround was required by the previous successful
      # builds to avoid the extremely long final -Os stage.
      # ==========================================================

      - name: Relax link-time optimization
        working-directory: cdda
        run: |
          set -euo pipefail

          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O1/' \
            Makefile

          echo "=== LDFLAGS ==="
          grep -n "LDFLAGS" Makefile | head -20


      # ==========================================================
      # 7. Verify Japanese translation source
      # ==========================================================

      - name: Verify Japanese translation source
        working-directory: cdda
        run: |
          set -euo pipefail

          test -f lang/po/ja.po

          echo "=== Japanese PO ==="
          ls -lh lang/po/ja.po


      # ==========================================================
      # 8. Compile Japanese PO -> MO
      # ==========================================================

      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          PO="lang/po/ja.po"
          MO="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          mkdir -p "$(dirname "$MO")"

          msgfmt \
            -f \
            -o "$MO" \
            "$PO"

          test -s "$MO"

          echo "=== Japanese MO ==="
          ls -lh "$MO"

          echo
          echo "=== SHA256 ==="
          sha256sum "$MO"


      # ==========================================================
      # 9. Patch CDDA 0.I:
      #
      # Change:
      #
      #   USE_LANG default = ""
      #
      # to:
      #
      #   USE_LANG default = "ja"
      #
      # This makes Japanese the actual CDDA default language.
      #
      # We deliberately patch the source before compilation rather
      # than trying to manipulate browser localStorage.
      # ==========================================================

      - name: Set Japanese as CDDA default language
        working-directory: cdda
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/options.cpp")
          text = path.read_text(encoding="utf-8")

          old = 'options_manager::get_lang_options(), "" );'
          new = 'options_manager::get_lang_options(), "ja" );'

          count = text.count(old)

          if count != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one USE_LANG default pattern, found {count}"
              )

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          print("Japanese default language patch applied.")
          PY

          echo
          echo "=== Verify USE_LANG default ==="

          grep -n \
            -A4 \
            -B2 \
            'add( "USE_LANG"' \
            src/options.cpp

          echo
          echo "=== Verify default value is ja ==="

          grep -n \
            'options_manager::get_lang_options(), "ja" );' \
            src/options.cpp


      # ==========================================================
      # 10. Build WebAssembly
      #
      # LOCALIZE=1 is mandatory.
      # LANGUAGES="ja" ensures Japanese localization support.
      # ==========================================================

      - name: Build cataclysm-tiles.js
        working-directory: cdda
        env:
          EMCC_DEBUG: "1"

        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          echo "=========================================="
          echo "BUILD CDDA 0.I"
          echo "=========================================="

          echo
          echo "=== Disk ==="
          df -h /

          echo
          echo "=== Memory ==="
          free -h

          echo
          echo "=== Localization ==="
          echo "LOCALIZE=1"
          echo "LANGUAGES=ja"
          echo "Default USE_LANG=ja"

          echo
          echo "=== Starting build ==="

          time make -j"$(nproc)" \
            NATIVE=emscripten \
            BACKTRACE=0 \
            TILES=1 \
            TESTS=0 \
            RUNTESTS=0 \
            RELEASE=1 \
            LOCALIZE=1 \
            LANGUAGES="ja" \
            CCACHE=0 \
            LINTJSON=0 \
            cataclysm-tiles.js

          echo
          echo "=== WASM output ==="

          test -s cataclysm-tiles.js
          test -s cataclysm-tiles.wasm

          ls -lh \
            cataclysm-tiles.js \
            cataclysm-tiles.wasm


      # ==========================================================
      # 11. Prepare official CDDA web bundle
      #
      # prepare-web.sh creates web_bundle and packs it once.
      # We will repack it AFTER inserting Japanese MO.
      # ==========================================================

      - name: Prepare base web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          bash build-scripts/prepare-web.sh

          echo
          echo "=== Base web bundle ==="

          find web_bundle \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -200


      # ==========================================================
      # 12. Add Japanese MO INSIDE web_bundle
      #
      # This is critical.
      #
      # CDDA runtime path:
      #
      #   /lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo
      #
      # The file must exist in the Emscripten virtual FS.
      # ==========================================================

      - name: Add Japanese locale to Emscripten virtual filesystem
        working-directory: cdda
        run: |
          set -euo pipefail

          MO_SRC="lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"
          MO_DST="web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -s "$MO_SRC"

          mkdir -p \
            "$(dirname "$MO_DST")"

          cp \
            "$MO_SRC" \
            "$MO_DST"

          echo "=========================================="
          echo "Japanese MO added to web_bundle"
          echo "=========================================="

          ls -lh "$MO_DST"

          echo
          echo "=== SHA256 ==="

          sha256sum "$MO_DST"


      # ==========================================================
      # 13. Verify Japanese locale BEFORE repacking
      # ==========================================================

      - name: Verify Japanese locale in web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          MO="web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -s "$MO"

          echo "Japanese locale exists at:"

          echo "/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          echo
          echo "=== File ==="

          file "$MO"

          echo
          echo "=== Translation statistics ==="

          msgfmt \
            --statistics \
            -o /dev/null \
            "$MO"


      # ==========================================================
      # 14. Repack Emscripten data
      #
      # This is NOT a C++ rebuild.
      #
      # Only the .data / .data.js package is regenerated.
      # ==========================================================

      - name: Repack Emscripten data with Japanese locale
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          rm -f \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js

          echo "=========================================="
          echo "REPACK EMSCRIPTEN DATA"
          echo "=========================================="

          "$EMSDK/upstream/emscripten/tools/file_packager" \
            cataclysm-tiles.data \
            --js-output=cataclysm-tiles.data.js \
            --no-node \
            --preload "web_bundle@/" \
            --lz4

          test -s cataclysm-tiles.data
          test -s cataclysm-tiles.data.js

          echo
          echo "=== Repacked files ==="

          ls -lh \
            cataclysm-tiles.data \
            cataclysm-tiles.data.js


      # ==========================================================
      # 15. Verify generated data package contains Japanese path
      #
      # Unlike the previous incorrect verification, this check is
      # performed AFTER file_packager has been run with the Japanese
      # file actually present in web_bundle.
      # ==========================================================

      - name: Verify Japanese locale in generated data package
        working-directory: cdda
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY GENERATED DATA PACKAGE"
          echo "=========================================="

          if ! grep -q \
            "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            cataclysm-tiles.data.js
          then
            echo
            echo "ERROR:"
            echo "Japanese MO was not found in generated data loader."
            echo
            echo "Searching Japanese references:"
            grep -n "lang/mo" cataclysm-tiles.data.js | head -50 || true
            exit 1
          fi

          echo
          echo "Japanese locale path found in generated data loader."

          grep -n \
            "lang/mo/ja" \
            cataclysm-tiles.data.js \
            | head -20


      # ==========================================================
      # 16. Install the newly repacked data files into build/
      # ==========================================================

      - name: Install repacked data files
        working-directory: cdda
        run: |
          set -euo pipefail

          test -s cataclysm-tiles.data
          test -s cataclysm-tiles.data.js

          cp \
            cataclysm-tiles.data \
            build/cataclysm-tiles.data

          cp \
            cataclysm-tiles.data.js \
            build/cataclysm-tiles.data.js

          echo "=== Installed data ==="

          ls -lh \
            build/cataclysm-tiles.data \
            build/cataclysm-tiles.data.js


      # ==========================================================
      # 17. Copy wrapper shell
      # ==========================================================

      - name: Copy profile-aware shell
        run: |
          set -euo pipefail

          test -f shell/index.html
          test -d cdda/build

          cp \
            shell/index.html \
            cdda/build/index.html


      # ==========================================================
      # 18. Stage final site
      # ==========================================================

      - name: Stage site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp -a \
            cdda/build/. \
            site/

          echo "=========================================="
          echo "FINAL SITE"
          echo "=========================================="

          find site \
            -maxdepth 6 \
            -type f \
            | sort

          echo
          echo "=== Site size ==="

          du -sh site/


      # ==========================================================
      # 19. Final verification
      # ==========================================================

      - name: Verify final site
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          REQUIRED_FILES=(
            "site/cataclysm-tiles.js"
            "site/cataclysm-tiles.wasm"
            "site/cataclysm-tiles.data"
            "site/cataclysm-tiles.data.js"
            "site/index.html"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: Missing or empty:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo
          echo "=== Verify Japanese locale is packaged ==="

          grep -q \
            "lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo" \
            site/cataclysm-tiles.data.js

          echo "OK: Japanese MO is present in generated data loader."

          echo
          echo "=== Verify patched CDDA source ==="

          grep -q \
            'options_manager::get_lang_options(), "ja" );' \
            cdda/src/options.cpp

          echo "OK: CDDA default USE_LANG is ja."

          echo
          echo "=========================================="
          echo "ALL VERIFICATIONS PASSED"
          echo "=========================================="


      # ==========================================================
      # 20. Upload raw artifact
      #
      # Nothing expensive happens after this point.
      # ==========================================================

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle-japanese
          path: site/
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 21. Upload GitHub Pages artifact
      # ==========================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/


  # ==============================================================
  # Deploy
  # ==============================================================

  deploy:
    name: Deploy to GitHub Pages

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
