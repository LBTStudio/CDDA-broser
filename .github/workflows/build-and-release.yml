name: Build CDDA 0.I WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cdda-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build CDDA 0.I WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Relax link optimization
        working-directory: cdda
        run: |
          set -euo pipefail

          sed -i \
            's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-Os[[:space:]]*$/LDFLAGS += -O1/' \
            Makefile

      - name: Build CDDA WebAssembly
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          # The final Emscripten JavaScript optimization can be quiet for
          # several minutes.  Four workers match the successful historical
          # runs; reducing this to two only lengthened the opaque final phase.
          # Plain-text heartbeats make every running minute observable.
          build_started_at="$(date +%s)"
          build_jobs=4
          heartbeat() {
            while sleep 60; do
              elapsed="$(( $(date +%s) - build_started_at ))"
              echo "[HEARTBEAT] WebAssembly build active: elapsed=${elapsed}s"
              free -h
              df -h /
              ps -eo pid,ppid,stat,etime,pcpu,pmem,cmd --sort=-pcpu | sed -n '1,12p'
            done
          }
          heartbeat &
          heartbeat_pid="$!"
          stop_heartbeat() {
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
          }
          trap stop_heartbeat EXIT

          build_cdda() {
            timeout --foreground --signal=TERM --kill-after=120s 45m \
              make -j"$build_jobs" \
                NATIVE=emscripten \
                BACKTRACE=0 \
                TILES=1 \
                TESTS=0 \
                RUNTESTS=0 \
                RELEASE=1 \
                LOCALIZE=1 \
                LANGUAGES=ja \
                CCACHE=0 \
                LINTJSON=0 \
                cataclysm-tiles.js
          }

          echo "[BUILD] primary mode: jobs=${build_jobs}, link optimization=-O1, timeout=45m"
          if time build_cdda; then
            echo "[BUILD] primary mode completed successfully"
          else
            build_status="$?"
            if [ "$build_status" -ne 124 ]; then
              echo "[BUILD] primary build failed with status=${build_status}; not retrying a non-timeout failure"
              exit "$build_status"
            fi

            echo "[RECOVERY] primary build exceeded 45 minutes; retrying with link optimization=-O0"
            rm -f cataclysm-tiles.js cataclysm-tiles.wasm
            sed -i \
              's/^[[:space:]]*LDFLAGS[[:space:]]*+=[[:space:]]*-O1[[:space:]]*$/LDFLAGS += -O0/' \
              Makefile
            build_started_at="$(date +%s)"
            timeout --foreground --signal=TERM --kill-after=120s 30m \
              make -j"$build_jobs" \
                NATIVE=emscripten \
                BACKTRACE=0 \
                TILES=1 \
                TESTS=0 \
                RUNTESTS=0 \
                RELEASE=1 \
                LOCALIZE=1 \
                LANGUAGES=ja \
                CCACHE=0 \
                LINTJSON=0 \
                cataclysm-tiles.js
          fi
          stop_heartbeat
          trap - EXIT

          test -s cataclysm-tiles.js
          test -s cataclysm-tiles.wasm

      - name: Compile Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          # cataclysm-tiles.js does not depend on the top-level `all` target,
          # so it does not automatically build localization artifacts.
          make localization LANGUAGES=ja

      - name: Verify Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail

          test -s lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          ls -lh \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

      - name: Create Japanese web preparation script
        working-directory: cdda
        run: |
          set -euo pipefail

          cp \
            build-scripts/prepare-web.sh \
            build-scripts/prepare-web-ja.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path("build-scripts/prepare-web-ja.sh")
          text = path.read_text(encoding="utf-8")

          marker = "$EMSDK/upstream/emscripten/tools/file_packager"

          if text.count(marker) != 1:
              raise SystemExit(
                  "Expected exactly one file_packager command"
              )

          japanese_copy = """\
          echo "Adding Japanese translation..."

          mkdir -p "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES"

          cp \
            lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo \
            "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          test -s \
            "$BUNDLE_DIR/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo"

          """

          text = text.replace(
              marker,
              japanese_copy + marker,
              1
          )

          path.write_text(text, encoding="utf-8")
          PY

          grep -n \
            -A12 \
            -B3 \
            "Adding Japanese translation" \
            build-scripts/prepare-web-ja.sh

      - name: Prepare Web bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          source "$EMSDK/emsdk_env.sh"

          bash build-scripts/prepare-web-ja.sh

      - name: Verify Japanese locale in bundle
        working-directory: cdda
        run: |
          set -euo pipefail

          test -s \
            web_bundle/lang/mo/ja/LC_MESSAGES/cataclysm-dda.mo

          test -s build/cataclysm-tiles.data
          test -s build/cataclysm-tiles.data.js
          test -s build/cataclysm-tiles.js
          test -s build/cataclysm-tiles.wasm

      - name: Copy custom index
        run: |
          set -euo pipefail

          test -f shell/index.html

          cp \
            shell/index.html \
            cdda/build/index.html

      - name: Stage GitHub Pages site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp -a cdda/build/. site/

          test -s site/index.html
          test -s site/cataclysm-tiles.js
          test -s site/cataclysm-tiles.wasm
          test -s site/cataclysm-tiles.data
          test -s site/cataclysm-tiles.data.js
          test -s site/Terminus.ttf
          test -s site/favicon.ico

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
