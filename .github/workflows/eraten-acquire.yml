name: Eraten temporary acquisition and structural scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eraten-acquire.yml"
      - "tools/eraten_acquire_scan.py"

permissions:
  contents: read

jobs:
  acquire-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Download and inspect in temporary storage
        env:
          ERATEN_SHARE_URL: "https://32.gigafile.nu/0111-hc19ff9a337d787399d294b1c4dff0baa"
          ERATEN_WORK_DIR: ${{ runner.temp }}/eraten-work
          ERATEN_REPORT_DIR: ${{ github.workspace }}/eraten-report
        run: python tools/eraten_acquire_scan.py
      - name: Upload small structural report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eraten-structural-report-${{ github.run_number }}
          path: eraten-report/
          if-no-files-found: warn
          retention-days: 1
