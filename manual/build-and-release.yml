name: Build CDDA 0.I WebAssembly

# ====================================================================
# ビルド時間の短縮について（4 時間かかっていた問題への対応）
# ====================================================================
#
# 【従来の構成】
#   単一ジョブ（ubuntu-latest = 4 vCPU）で
#     440 TU をコンパイル → リンク → データ同梱
#   を順番に実行していた。所要 約 4 時間。
#
# 【所要時間の内訳と、縮められる部分】
#   (1) コンパイル段: 440 TU を .o にする
#       TU 間に依存が無いので【いくらでも並列化できる】
#   (2) リンク段: Binaryen(wasm-opt) が -Os + ASYNCIFY で
#       モジュール全体の呼び出しグラフを解析する
#       単一スレッドで動き【原理的に分割できない】
#   (3) データ同梱: file_packager が data/ と gfx/ を lz4 で
#       1 個の .data にまとめる
#       .js/.wasm に依存しないので【リンクと並行できる】
#
# 【この構成で行った対策】
#   ・(1) を N ジョブに分割 → Actions は別マシンで並列実行
#   ・(3) を (1)(2) と並行する独立ジョブにする
#   ・ccache を actions/cache で持ち回り
#   ・wasm-opt を Binaryen 132 に差し替え（-37.8% 削減）
#   ・リンク結果をキャッシュ化（入力が同じなら 4 時間省略）
#   ・リンク最適化レベルを切り替え可能に（配信用 O2 / 検証用 O1）
#
# 【ジョブの依存���係】
#
#     plan ────┬──> compile (N並列) ──> link ──┐
#              │                                ├──> bundle ──> deploy
#              └──> data ───────────────────────┘
#
#   data は plan にしか依存しないので、compile と同時に走り始める。
#
# ====================================================================

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy the built bundle to GitHub Pages"
        required: false
        default: true
        type: boolean
      shards:
        description: "コンパイルの分割数（多いほど速いが .o の転送量が増える）"
        required: false
        default: "8"
        type: choice
        options:
          - "4"
          - "6"
          - "8"
          - "12"
      link_opt:
        description: "リンク段の最適化レベル（O2=配信用・高品質、O1=検証用・高速）"
        required: false
        default: "O2"
        type: choice
        options:
          - "O2"
          - "O1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cdda-pages
  cancel-in-progress: false

jobs:
  # ==================================================================
  # ジョブ 1: 計画
  # ==================================================================
  plan:
    name: 計画
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      cache_key: ${{ steps.plan.outputs.cache_key }}
      link_cache_key: ${{ steps.plan.outputs.link_cache_key }}

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Apply Emscripten web runtime patches
        working-directory: cdda
        run: bash ../ci/apply-patches.sh ../patches

      - name: Tune web memory for 4GB devices
        working-directory: cdda
        run: |
          set -euo pipefail
          CDDA_LINK_OPT="${{ inputs.link_opt }}" bash ../ci/tune-makefile.sh

      - name: Setup emsdk (for wasm-opt --version)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      # 【重要】Binaryen 差し替えを指紋計算の前に実行する
      # これがないと、116 と 132 のキャッシュが混ざる
      - name: Replace wasm-opt with Binaryen 132
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          bash ./ci/setup-binaryen.sh

      - name: Build shard plan
        id: plan
        working-directory: cdda
        run: |
          set -euo pipefail

          bash ../ci/shard-plan.sh "${{ inputs.shards }}" ../shard-plan

          echo "matrix=$( cat ../shard-plan/matrix.json )" >> "$GITHUB_OUTPUT"

          # ccache のキャッシュキーに使うハッシュ
          cache_key="$( cat ../patches/*.patch ../ci/*.sh | sha256sum | cut -c1-16 )"
          echo "cache_key=${cache_key}" >> "$GITHUB_OUTPUT"
          echo "キャッシュキー: ${cache_key}"

          # 【重要】リンク結果のキャッシュキーを計算
          # 入力（.o + リンク引数）が同じなら、wasm を再生成せず過去のものを再利用する
          link_fingerprint="$( bash ../ci/link-fingerprint.sh ../shard-plan/objs-all.txt )"
          echo "link_cache_key=${link_fingerprint}" >> "$GITHUB_OUTPUT"
          echo "リンク結果キャッシュ: ${link_fingerprint}"

      - name: Upload shard plan
        uses: actions/upload-artifact@v4
        with:
          name: shard-plan
          path: shard-plan/
          if-no-files-found: error
          retention-days: 1

      - name: Write summary header
        run: |
          set -euo pipefail
          {
            echo "## ビルド計画"
            echo ""
            echo '```'
            cat shard-plan/summary.txt
            echo '```'
            echo ""
            echo "## リンク最適化レベル"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| レベル | ${{ inputs.link_opt }} |"
            echo "| 効果 | ${{ inputs.link_opt == 'O1' && '約 53 分（-78%）' || '約 3h14m（-20%）' }} |"
            echo ""
            echo "## 各工程の実測"
            echo ""
            echo "| 工程 | 対象 | 所要 | 成果物 |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==================================================================
  # ジョブ 2: コンパイル（N 並列）
  # ==================================================================
  compile:
    name: コンパイル shard-${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON( needs.plan.outputs.matrix ) }}

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Apply Emscripten web runtime patches
        working-directory: cdda
        run: bash ../ci/apply-patches.sh ../patches

      - name: Tune web memory for 4GB devices
        working-directory: cdda
        run: |
          set -euo pipefail
          CDDA_LINK_OPT="${{ inputs.link_opt }}" bash ../ci/tune-makefile.sh

      - name: Download shard plan
        uses: actions/download-artifact@v4
        with:
          name: shard-plan
          path: shard-plan

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ needs.plan.outputs.cache_key }}-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ needs.plan.outputs.cache_key }}-s${{ matrix.shard }}-
            ccache-${{ needs.plan.outputs.cache_key }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache --max-size=2G
          ccache --zero-stats

      - name: Compile shard
        working-directory: cdda
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          bash ../ci/build-shard.sh \
            "${{ matrix.shard }}" \
            "../shard-plan/shard-${{ matrix.shard }}.txt"

      - name: Upload shard objects
        uses: actions/upload-artifact@v4
        with:
          name: objs-shard-${{ matrix.shard }}
          path: cdda/obj/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  # ==================================================================
  # ジョブ 3: データ同梱（compile / link と並行）
  # ==================================================================
  data:
    name: データ同梱
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Apply Emscripten web runtime patches
        working-directory: cdda
        run: bash ../ci/apply-patches.sh ../patches

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext jq

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Pack game data with Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          bash ../ci/prepare-data.sh ..

      - name: Upload packed data
        uses: actions/upload-artifact@v4
        with:
          name: packed-data
          path: |
            cdda/cataclysm-tiles.data
            cdda/cataclysm-tiles.data.js
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # ==================================================================
  # ジョブ 4: リンク
  # ==================================================================
  # 【重要】リンク結果がキャッシュから取得できる場合、この段階は秒で終わる
  link:
    name: リンク
    needs: [plan, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Apply Emscripten web runtime patches
        working-directory: cdda
        run: bash ../ci/apply-patches.sh ../patches

      - name: Tune web memory for 4GB devices
        working-directory: cdda
        run: |
          set -euo pipefail
          CDDA_LINK_OPT="${{ inputs.link_opt }}" bash ../ci/tune-makefile.sh

      - name: Download shard plan
        uses: actions/download-artifact@v4
        with:
          name: shard-plan
          path: shard-plan

      - name: Download all shard objects
        uses: actions/download-artifact@v4
        with:
          pattern: objs-shard-*
          path: cdda/obj/
          merge-multiple: true

      - name: Verify object layout
        working-directory: cdda
        run: |
          set -euo pipefail

          found="$( find obj -name '*.o' -type f | wc -l )"
          expected="$( grep -c . ../shard-plan/objs-all.txt )"

          echo "見つかった .o: ${found} 個"
          echo "期待する数:    ${expected} 個"

          if [ "$found" -eq 0 ]; then
            echo "ERROR: obj/ 以下に .o が 1 個もありません。" >&2
            exit 1
          fi

          echo "オブジェクトの配置を確認しました"
          du -sh obj

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      # 【重要】Binaryen 差し替えを実施（指紋計算と同じ場所で）
      - name: Replace wasm-opt with Binaryen 132
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          bash ./ci/setup-binaryen.sh

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ needs.plan.outputs.cache_key }}-link-${{ github.run_id }}
          restore-keys: |
            ccache-${{ needs.plan.outputs.cache_key }}-link-
            ccache-${{ needs.plan.outputs.cache_key }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache --max-size=2G
          ccache --zero-stats

      # 【キャッシュキー】リンク結果を保存
      # 【リンク入力が同じなら】前回のキャッシュを使い、4 時間を秒で済ませる
      - name: Restore wasm link cache
        id: link_cache
        uses: actions/cache@v4
        with:
          path: |
            cdda/cataclysm-tiles.js
            cdda/cataclysm-tiles.wasm
          key: wasm-link-${{ needs.plan.outputs.link_cache_key }}

      - name: Link WebAssembly (if not cached)
        if: steps.link_cache.outputs.cache-hit != 'true'
        working-directory: cdda
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          CDDA_LINK_OPT="${{ inputs.link_opt }}" bash ../ci/link.sh ../shard-plan/objs-all.txt

      # ------------------------------------------------------------
      # 生成物の検証【配信事故の再発防止】
      # ------------------------------------------------------------
      # 以前ここは test -s（サイズが 0 でない）だけを見ていた。
      # その結果 run 33985475507（#75）は全ジョブ緑で配信まで通り、
      # ブラウザで開くと起動しないという事故になった:
      #
      #   CompileError: WebAssembly.instantiateStreaming():
      #   size 7657177 > maximum function size 7654321 @+249007
      #
      # V8 には「1 関数あたり 7,654,321 バイト」の実装上限があり、
      # これを超えると instantiate できない。しかし em++ /
      # wasm-opt の終了コードは【0】なので CI では分からない。
      #
      # 動いていた #71 と比較すると、最大関数は
      #   #71: 7,459,141 B = 上限の 97.45%（余裕 195KB のみ）
      #   #75: 7,657,177 B = 上限の 100.04%（超過 2,856B）
      # であり、巨大関数は【元から存在して崖っぷちだった】。
      #
      # よって「今回の設定を直す」だけでは不十分で、
      # 生成物を毎回測って上限未満であることを確認する必要がある。
      # ci/verify-wasm.sh が code section を解析して最大関数を測り、
      # 上限超過なら失敗、95% 超なら警告を出す。
      - name: Verify linked binary
        working-directory: cdda
        run: |
          set -euo pipefail
          test -s cataclysm-tiles.js
          test -s cataclysm-tiles.wasm
          echo "リンク結果を確認しました:"
          ls -lh cataclysm-tiles.js cataclysm-tiles.wasm

          # V8 の 1 関数上限を超えていないか検証する。
          # ここで落とすのが目的（ユーザーのブラウザで発覚させない）。
          bash ../ci/verify-wasm.sh cataclysm-tiles.wasm

      - name: Upload linked binary
        uses: actions/upload-artifact@v4
        with:
          name: linked-wasm
          path: |
            cdda/cataclysm-tiles.js
            cdda/cataclysm-tiles.wasm
          if-no-files-found: error
          retention-days: 1

  # ==================================================================
  # ジョブ 5: 配布物の組み立て
  # ==================================================================
  bundle:
    name: 配布物の組み立て
    needs: [data, link]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Download packed data
        uses: actions/download-artifact@v4
        with:
          name: packed-data
          path: cdda/

      - name: Download linked binary
        uses: actions/download-artifact@v4
        with:
          name: linked-wasm
          path: cdda/

      - name: Assemble distribution bundle
        working-directory: cdda
        run: bash ../ci/prepare-bundle.sh

      - name: Copy custom index
        run: |
          set -euo pipefail

          test -f shell/index.html

          cp shell/index.html cdda/build/index.html

          grep -q "showLoadProgress" cdda/build/index.html
          grep -q "compositionstart" cdda/build/index.html
          grep -q "compositionupdate" cdda/build/index.html

          echo "独自 index.html への差し替えを確認しました"

      - name: Stage GitHub Pages site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp -a cdda/build/. site/

          test -s site/index.html
          test -s site/cataclysm-tiles.js
          test -s site/cataclysm-tiles.wasm
          test -s site/cataclysm-tiles.data
          test -s site/cataclysm-tiles.data.js
          test -s site/Terminus.ttf
          test -s site/favicon.ico

          echo "公開物一覧:"
          ls -lh site/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.deploy_pages != false }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ==================================================================
  # ジョブ 6: 公開
  # ==================================================================
  deploy:
    name: Deploy to GitHub Pages
    if: ${{ inputs.deploy_pages != false }}
    needs: bundle
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
