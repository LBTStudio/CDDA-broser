name: Build CDDA 0.I WebAssembly

# ====================================================================
# ビルド時間の短縮について（4 時間かかっていた問題への対応）
# ====================================================================
#
# 【従来の構成】
#   単一ジョブ（ubuntu-latest = 4 vCPU）で
#     440 TU をコンパイル → リンク → データ同梱
#   を順番に実行していた。所要 約 4 時間。
#
# 【所要時間の内訳と、縮められる部分】
#   (1) コンパイル段: 440 TU を .o にする
#       TU 間に依存が無いので【いくらでも並列化できる】
#   (2) リンク段: Binaryen(wasm-opt) が -Os + ASYNCIFY で
#       モジュール全体の呼び出しグラフを解析する
#       単一スレッドで動き【原理的に分割できない】
#   (3) データ同梱: file_packager が data/ と gfx/ を lz4 で
#       1 個の .data にまとめる
#       .js/.wasm に依存しないので【リンクと並行できる】
#
# 【この構成で行った 3 つの対策】
#   ・(1) を N ジョブに分割 → Actions は別マシンで並列実行するので
#     実質 4×N 並列になる
#   ・(3) を (1)(2) と並行する独立ジョブにする
#   ・ccache を actions/cache で持ち回り、変更の無い TU の
#     コンパイルを丸ごと省略する（実測で 7s → 0s）
#
# 【正直に書いておくこと】
#   リンク段は縮まない。全体の所要時間は
#   「リンク段 + アーティファクト転送 + α」が下限であり、
#   それ以下にはならない。これは技術的な限界である。
#
#   また分割の代償として .o（合計 1GB 超）のアップロード／
#   ダウンロード時間が新たに発生する。コンパイル段の短縮が
#   これを上回る前提で成り立っている。シャード数を増やしすぎると
#   転送のオーバーヘッドが勝って逆に遅くなる。
#
# 【ジョブの依存関係】
#
#     plan ────┬──> compile (N並列) ──> link ──┐
#              │                                ├──> bundle ──> deploy
#              └──> data ───────────────────────┘
#
#   data は plan にしか依存しないので、compile と同時に走り始める。
#
# 【進捗バー】
#   各ジョブが ci/progress.sh を使い、生成済み .o の実在数を
#   数えてバーと残り時間推定を出す。make の出力形式・並列度・
#   ccache のヒット率に依存しない方式である。
#   加えて各ジョブが実行結果ページ（Summary）に 1 行の要約を
#   出すので、どのジョブが遅いか一目で分かる。
#
# 【CI ロジックを ci/*.sh に出している理由】
#   分割すると make を呼ぶ場所が「計画・N シャード・リンク」に
#   増える。渡す make 変数が 1 つでも食い違うと OBJS の中身が
#   ずれ、しかも【最後のリンクまで発覚しない】。
#   YAML に同じ内容をコピペする方式では必ず片方を直し忘れる。
#   スクリプトなのでローカルで実行して検証でき、実際に検証中に
#   4 件の不具合（マーカー不一致 2 件、古い shard ファイルの
#   残留、pipefail による数値破損）を発見・修正できた。
# ====================================================================

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy the built bundle to GitHub Pages"
        required: false
        default: true
        type: boolean
      shards:
        description: "コンパイルの分割数（多いほど速いが .o の転送量が増える）"
        required: false
        default: "8"
        type: choice
        options:
          - "4"
          - "6"
          - "8"
          - "12"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cdda-pages
  cancel-in-progress: false

jobs:
  # ==================================================================
  # ジョブ 1: 計画
  # ==================================================================
  # 440 個のオブジェクトを N 分割し、一覧をアーティファクトに置く。
  # ここで一覧を【1 回だけ】確定させ、全シャードとリンクが同じ
  # 一覧を参照することで、担当の抜けや重複を構造的に防ぐ。
  plan:
    name: 計画
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      cache_key: ${{ steps.plan.outputs.cache_key }}

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Apply Emscripten web runtime patches
        working-directory: cdda
        run: ../ci/apply-patches.sh ../patches

      - name: Tune web memory for 4GB devices
        working-directory: cdda
        run: ../ci/tune-makefile.sh

      - name: Build shard plan
        id: plan
        working-directory: cdda
        run: |
          set -euo pipefail

          ../ci/shard-plan.sh "${{ inputs.shards }}" ../shard-plan

          echo "matrix=$( cat ../shard-plan/matrix.json )" >> "$GITHUB_OUTPUT"

          # ccache のキャッシュキーに使うハッシュ。
          #
          # 【patches/ と ci/ を含める理由】
          # パッチが変われば .cpp が変わり .o も変わる。
          # ci/*.sh が変われば make 変数が変わりうる。
          # どちらもキーに含めないと、内容の合わないキャッシュを
          # 引き継いでしまう。
          #
          # ccache 自身もコンパイラ引数と前処理結果をハッシュ
          # するので誤ヒットはしないが、キーを分けておけば
          # 無駄なキャッシュを転送せずに済む。
          cache_key="$( cat ../patches/*.patch ../ci/*.sh | sha256sum | cut -c1-16 )"
          echo "cache_key=${cache_key}" >> "$GITHUB_OUTPUT"
          echo "キャッシュキー: ${cache_key}"

      - name: Upload shard plan
        uses: actions/upload-artifact@v4
        with:
          name: shard-plan
          path: shard-plan/
          if-no-files-found: error
          retention-days: 1

      - name: Write summary header
        run: |
          set -euo pipefail
          {
            echo "## ビルド計画"
            echo ""
            echo '```'
            cat shard-plan/summary.txt
            echo '```'
            echo ""
            echo "リンク段は単一スレッドで分割できないため、"
            echo "所要時間の下限はリンク段の時間になります。"
            echo ""
            echo "## 各工程の実測"
            echo ""
            echo "| 工程 | 対象 | 所要 | 成果物 |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==================================================================
  # ジョブ 2: コンパイル（N 並列）
  # ==================================================================
  compile:
    name: コンパイル shard-${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      # 【fail-fast: false にする理由】
      # 1 つのシャードが失敗しても他を走らせ続ける。そうすれば
      # 「1 つだけ落ちた」のか「全部落ちた」のかが 1 回の実行で
      # 分かり、原因の切り分けが 1 往復で済む。
      # true だと最初の失敗で他が巻き取られ、他シャードが健全か
      # どうかの情報が失われる。
      fail-fast: false
      matrix:
        shard: ${{ fromJSON( needs.plan.outputs.matrix ) }}

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      # 【なぜ各ジョブでパッチを当て直すのか】
      # パッチ済みソースをアーティファクトで配る手もあるが、
      # CDDA のソースツリーは数百 MB あり、転送時間が
      # git apply の時間（数秒）を大きく上回る。
      #
      # また checkout + apply-patches.sh は決定的なので、
      # どのジョブでも同一の結果になることが保証される。
      # 【重要】この同一性は version.h の一致にも効いている。
      # version.h は git describe / rev-parse / dirty 判定で
      # 決まるため、手順が違うとシャード間で中身が食い違い、
      # リンク時に不整合（-Wodr）を起こしうる。
      - name: Apply Emscripten web runtime patches
        working-directory: cdda
        run: ../ci/apply-patches.sh ../patches

      - name: Tune web memory for 4GB devices
        working-directory: cdda
        run: ../ci/tune-makefile.sh

      - name: Download shard plan
        uses: actions/download-artifact@v4
        with:
          name: shard-plan
          path: shard-plan

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      # ------------------------------------------------------------
      # ccache のキャッシュ
      # ------------------------------------------------------------
      # 【キー設計】key に run_id を入れて毎回新しく保存し、
      # restore-keys で前回のものを引き継ぐ。
      #
      # actions/cache は同一キーへの上書きを許さないため、
      # 固定キーにすると「最初に保存されたキャッシュが永久に
      # 使われ、以降のビルドで育たない」状態になる。
      # run_id を入れることで毎回保存され、キャッシュが育つ。
      #
      # 【シャードごとにキーを分ける理由】
      # 各シャードは担当 TU が固定なので、自分の担当ぶんだけを
      # 持つ小さなキャッシュで足りる。全シャードで共有すると
      # 1 個が肥大し、毎ジョブが全体をダウンロードする無駄が出る。
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ needs.plan.outputs.cache_key }}-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ needs.plan.outputs.cache_key }}-s${{ matrix.shard }}-
            ccache-${{ needs.plan.outputs.cache_key }}-

      - name: Configure ccache
        run: |
          set -euo pipefail

          # 1 シャードあたり 73 TU 程度なので 2GB で数世代分保持できる。
          # 【上限に注意】GitHub Actions のキャッシュはリポジトリ全体で
          # 10GB が上限で、超えると古いものから自動削除される。
          # シャード数 × 実使用量がこれを超えないよう控えめにする。
          ccache --max-size=2G
          ccache --zero-stats

      - name: Compile shard
        working-directory: cdda
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          ../ci/build-shard.sh \
            "${{ matrix.shard }}" \
            "../shard-plan/shard-${{ matrix.shard }}.txt"

      # 【compression-level: 9 にする理由】
      # .o は圧縮が効く（文字列やデバッグ情報が多い）。
      # 転送時間はこの分割方式の主な代償なので、圧縮時間を
      # 払ってでも転送量を減らす方が有利である。
      # .o の合計は 1GB を超えるため、圧縮率の差が効く。
      - name: Upload shard objects
        uses: actions/upload-artifact@v4
        with:
          name: objs-shard-${{ matrix.shard }}
          path: cdda/obj/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  # ==================================================================
  # ジョブ 3: データ同梱（compile / link と並行）
  # ==================================================================
  # needs が plan だけなので、compile と同時に走り始める。
  # 従来はリンク後に直列で足されていた時間がここで消える。
  data:
    name: データ同梱
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      # 【パッチが必要な理由】
      # データ同梱に C++ のパッチは効かないが、
      # tune-makefile.sh が触る Makefile は localization
      # ターゲットにも関わる。手順を揃えておく方が安全である。
      - name: Apply Emscripten web runtime patches
        working-directory: cdda
        run: ../ci/apply-patches.sh ../patches

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # gettext: 日本語 .mo のコンパイル（msgfmt）
          # jq:      廃止 mod の判定（modinfo.json の obsolete）
          sudo apt-get install -y gettext jq

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Pack game data with Japanese translation
        working-directory: cdda
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          ../ci/prepare-data.sh ..

      - name: Upload packed data
        uses: actions/upload-artifact@v4
        with:
          name: packed-data
          path: |
            cdda/cataclysm-tiles.data
            cdda/cataclysm-tiles.data.js
          if-no-files-found: error
          retention-days: 1
          # .data は既に lz4 圧縮済みなので、さらに圧縮しても
          # ほとんど縮まない。圧縮時間だけ無駄になるので 0 にする。
          compression-level: 0

  # ==================================================================
  # ジョブ 4: リンク
  # ==================================================================
  # 全シャードの .o を集めて wasm にする。
  # ここは単一スレッドで分割できず、所要時間の下限になる。
  link:
    name: リンク
    needs: [plan, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Apply Emscripten web runtime patches
        working-directory: cdda
        run: ../ci/apply-patches.sh ../patches

      - name: Tune web memory for 4GB devices
        working-directory: cdda
        run: ../ci/tune-makefile.sh

      - name: Download shard plan
        uses: actions/download-artifact@v4
        with:
          name: shard-plan
          path: shard-plan

      # ------------------------------------------------------------
      # 【展開先のパスに注意】
      # ------------------------------------------------------------
      # upload-artifact は「単一ディレクトリを path に指定すると、
      # そのディレクトリの【中身】がアーティファクトの root になる」
      # 仕様である（公式 README の
      # "If multiple paths are provided as input, the least common
      #  ancestor of all the search paths will be used as the root
      #  directory of the artifact" と同じ原則）。
      #
      # compile ジョブは path: cdda/obj/ でアップロードしているので、
      # アーティファクトの中身は
      #     tiles/achievement.o
      #     tiles/action.o
      #     ...
      # であり、先頭に obj/ は【付かない】。
      #
      # したがって展開先は cdda/ ではなく【cdda/obj/】にする。
      #   誤: path: cdda/      → cdda/tiles/*.o （Makefile が探す場所と違う）
      #   正: path: cdda/obj/  → cdda/obj/tiles/*.o
      #
      # ここを間違えると .o が 1 個も見つからず、link.sh の
      # 完全性検証が「440 個すべて欠落」と報告して止まる。
      # （検証を入れてあるので誤公開はしないが、原因が
      #   分かりにくいので明記しておく）
      #
      # 【merge-multiple: true の意味】
      # objs-shard-0 〜 objs-shard-N を同一ディレクトリに
      # 重ね合わせて展開する。各シャードの担当は排他（shard-plan.sh
      # が重複なしを検証済み）なので、衝突は起きない。
      # 指定しないと名前ごとのサブディレクトリに分かれてしまう。
      - name: Download all shard objects
        uses: actions/download-artifact@v4
        with:
          pattern: objs-shard-*
          path: cdda/obj/
          merge-multiple: true

      - name: Verify object layout
        working-directory: cdda
        run: |
          set -euo pipefail

          # 【展開先が正しいかを、リンクを試す前に確かめる】
          # 期待する場所に .o があるかを数える。
          # ここで止めれば、原因が「パスの間違い」であることが
          # 一目で分かる。
          found="$( find obj -name '*.o' -type f | wc -l )"
          expected="$( grep -c . ../shard-plan/objs-all.txt )"

          echo "見つかった .o: ${found} 個"
          echo "期待する数:    ${expected} 個"

          if [ "$found" -eq 0 ]; then
            echo "ERROR: obj/ 以下に .o が 1 個もありません。" >&2
            echo "       アーティファクトの展開先が想定と違う可能性があります。" >&2
            echo "       実際に展開された内容:" >&2
            find . -maxdepth 3 -name '*.o' -type f 2>/dev/null | head -5 >&2
            find . -maxdepth 2 -type d 2>/dev/null | head -20 >&2
            exit 1
          fi

          echo "オブジェクトの配置を確認しました"
          du -sh obj

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift || true

          df -h /

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      # リンクジョブでも PCH が必要になる（.o の依存に入っているため、
      # 無いと make が全 .o を作り直そうとする）。
      # ccache があれば PCH の生成も速くなる。
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ needs.plan.outputs.cache_key }}-link-${{ github.run_id }}
          restore-keys: |
            ccache-${{ needs.plan.outputs.cache_key }}-link-
            ccache-${{ needs.plan.outputs.cache_key }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache --max-size=2G
          ccache --zero-stats

      - name: Link WebAssembly
        working-directory: cdda
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          ../ci/link.sh ../shard-plan/objs-all.txt

      - name: Upload linked binary
        uses: actions/upload-artifact@v4
        with:
          name: linked-wasm
          path: |
            cdda/cataclysm-tiles.js
            cdda/cataclysm-tiles.wasm
          if-no-files-found: error
          retention-days: 1

  # ==================================================================
  # ジョブ 5: 配布物の組み立て
  # ==================================================================
  # data ジョブと link ジョブの成果物が合流する場所。
  bundle:
    name: 配布物の組み立て
    needs: [data, link]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout CDDA 0.I source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 0.I
          path: cdda
          fetch-depth: 1

      - name: Download packed data
        uses: actions/download-artifact@v4
        with:
          name: packed-data
          path: cdda/

      - name: Download linked binary
        uses: actions/download-artifact@v4
        with:
          name: linked-wasm
          path: cdda/

      - name: Assemble distribution bundle
        working-directory: cdda
        run: ../ci/prepare-bundle.sh

      # 【独自 index.html で差し替える理由】
      # 上流の build-data/web/index.html には読み込み進捗表示が
      # 無い。shell/index.html は読み込み進捗（showLoadProgress）と
      # 日本語入力（IME）のブリッジを持つので、必ず差し替える。
      # ここを飛ばすと日本語入力が動かない。
      - name: Copy custom index
        run: |
          set -euo pipefail

          test -f shell/index.html

          cp shell/index.html cdda/build/index.html

          # 差し替えが効いたことの確認。
          # 【必須】cp が成功しても中身が期待どおりとは限らない。
          # 上流の index.html が残っていると
          #   ・読み込み進捗が出ない（起動が固まったように見える）
          #   ・日本語入力ができない（IME ブリッジが無い）
          # という形で、ビルドは成功しているのに遊べない状態になる。
          #
          # 実際に shell/index.html に存在する識別子で検査する。
          # （grep 対象は実物を確認して選んでいる。存在しない
          #   識別子を書くと、この検査自体が常に失敗する）
          grep -q "showLoadProgress" cdda/build/index.html
          grep -q "compositionstart" cdda/build/index.html
          grep -q "compositionupdate" cdda/build/index.html

          echo "独自 index.html への差し替えを確認しました"
          echo "  読み込み進捗: showLoadProgress あり"
          echo "  日本語入力:   compositionstart / compositionupdate あり"

      - name: Stage GitHub Pages site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp -a cdda/build/. site/

          test -s site/index.html
          test -s site/cataclysm-tiles.js
          test -s site/cataclysm-tiles.wasm
          test -s site/cataclysm-tiles.data
          test -s site/cataclysm-tiles.data.js
          test -s site/Terminus.ttf
          test -s site/favicon.ico

          echo "公開物一覧:"
          ls -lh site/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdda-0I-web-bundle
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.deploy_pages != false }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ==================================================================
  # ジョブ 6: 公開
  # ==================================================================
  deploy:
    name: Deploy to GitHub Pages
    if: ${{ inputs.deploy_pages != false }}
    needs: bundle
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
